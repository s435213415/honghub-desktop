<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>鸿汇影 · 平台清单管理</title>
<style>
  :root{--bg:#0f1424;--card:#182136;--line:#2a3550;--ink:#e8eefc;--dim:#93a1c4;--ok:#3ddc84;--bad:#ff6b6b;--warn:#f5b942}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
  header{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
  h1{font-size:17px;margin:0;font-weight:600}
  .dim{color:var(--dim);font-size:12.5px}
  main{padding:18px 22px 40px}
  .bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  input,select,button{background:#101828;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:inherit}
  button{cursor:pointer}
  button.p{background:#2f7bf6;border-color:#2f7bf6}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:16px}
  .card h2{font-size:14.5px;margin:0 0 10px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:6px 8px;border-bottom:1px solid #223052;vertical-align:middle}
  th{color:var(--dim);font-weight:500}
  .tag{display:inline-block;padding:1px 7px;border-radius:6px;background:#222d47;color:#a9b8dc;font-size:12px}
  .row-actions button{padding:3px 8px;font-size:12px}
  .ok{color:var(--ok)} .bad{color:var(--bad)} .warn{color:var(--warn)}
  .hide{display:none}
</style>
</head>
<body>
<header>
  <h1>平台清单管理</h1>
  <span class="dim" id="sum">加载中…</span>
  <span class="dim">· 源健康度：<span id="health">读取中…</span></span>
</header>
<main>
  <div class="card">
    <h2>筛选</h2>
    <div class="bar">
      <select id="cat"><option value="">全部分类</option></select>
      <select id="prov"><option value="">全部省份</option></select>
      <input id="q" placeholder="搜索名称或网址" style="min-width:240px">
      <button id="reload">刷新</button>
      <button id="sync-base">把当前清单写回页面基线</button>
    </div>
    <div class="dim" id="hint">改分类/改名字/删条目都在这里做；删错可从 server/data/manifest.before-site-*.json 还原。</div>
  </div>
  <div class="card">
    <h2>平台条目</h2>
    <table>
      <thead><tr><th style="width:56px">#</th><th style="width:170px">名称</th><th>网址</th><th style="width:120px">分类</th><th style="width:70px">省份</th><th style="width:150px">操作</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</main>
<script>
var SITES = [], FILTER = {cat:'', prov:'', q:''};
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

function load(){
  fetch('/api/sites', {cache:'no-store'}).then(function(r){ return r.json(); }).then(function(d){
    SITES = d.sites || [];
    $('sum').textContent = '共 ' + SITES.length + ' 个平台 · 清单 v' + (d.manifestVersion || '-');
    var cats = {}, provs = {};
    SITES.forEach(function(s){ cats[s.cat || '综合视频'] = 1; if(s.prov) provs[s.prov] = 1; });
    $('cat').innerHTML = '<option value="">全部分类</option>' + Object.keys(cats).map(function(c){ return '<option>'+esc(c)+'</option>'; }).join('');
    $('prov').innerHTML = '<option value="">全部省份</option>' + Object.keys(provs).map(function(c){ return '<option>'+esc(c)+'</option>'; }).join('');
    $('cat').value = FILTER.cat; $('prov').value = FILTER.prov;
    render();
  }).catch(function(e){ $('sum').textContent = '读取失败：' + e.message; });
}
function render(){
  var list = SITES.filter(function(s){
    if(FILTER.cat && (s.cat||'综合视频') !== FILTER.cat) return false;
    if(FILTER.prov && s.prov !== FILTER.prov) return false;
    if(FILTER.q){ var k = FILTER.q.toLowerCase(); if((s.name||'').toLowerCase().indexOf(k) < 0 && (s.url||'').toLowerCase().indexOf(k) < 0) return false; }
    return true;
  });
  $('rows').innerHTML = list.map(function(s, i){
    return '<tr data-url="' + esc(s.url) + '">' +
      '<td class="dim">' + (i+1) + '</td>' +
      '<td>' + esc(s.name) + '</td>' +
      '<td class="dim" style="word-break:break-all">' + esc(s.url) + '</td>' +
      '<td><span class="tag">' + esc(s.cat||'综合视频') + '</span></td>' +
      '<td class="dim">' + esc(s.prov||s.tag||'') + '</td>' +
      '<td class="row-actions"><button data-act="cat">改分类</button> <button data-act="name">改名</button> <button data-act="del">删除</button></td>' +
      '</tr>';
  }).join('') || '<tr><td colspan="6" class="dim">没有匹配的条目</td></tr>';
}
document.addEventListener('click', function(e){
  var b = e.target.closest('button[data-act]');
  if(!b) return;
  var tr = b.closest('tr'), url = tr.getAttribute('data-url'), act = b.getAttribute('data-act');
  var s = SITES.filter(function(x){ return x.url === url; })[0]; if(!s) return;
  if(act === 'del'){
    if(!confirm('确认删除「' + s.name + '」？')) return;
    post('/api/sites/remove', {url: url}).then(load);
  } else if(act === 'cat'){
    var c = prompt('新分类（例如 各地广电 / 综合视频 / 直播平台）', s.cat || '综合视频'); if(!c) return;
    post('/api/sites/update', {url: url, patch: {cat: c}}).then(load);
  } else if(act === 'name'){
    var n = prompt('新名称', s.name); if(!n) return;
    post('/api/sites/update', {url: url, patch: {name: n}}).then(load);
  }
});
function post(u, body){
  return fetch(u, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)})
    .then(function(r){ return r.json(); }).then(function(d){
      if(!d.ok) alert('操作失败：' + (d.error || '未知错误'));
      return d;
    });
}
['cat','prov'].forEach(function(id){ $(id).addEventListener('change', function(){ FILTER[id] = $(id).value; render(); }); });
$('q').addEventListener('input', function(){ FILTER.q = $('q').value.trim(); render(); });
$('reload').addEventListener('click', load);
$('sync-base').addEventListener('click', function(){
  $('hint').textContent = '写回页面基线请在本机执行：node scripts/sync-sites.js（写 app/index.html 的 BUILTIN_SITES，HAP 出包时会自动内嵌）';
});
fetch('/api/sources/health', {cache:'no-store'}).then(function(r){ return r.json(); }).then(function(d){
  $('health').innerHTML = d.ready
    ? ('<span class="ok">' + d.totals.ok + ' 可用 / ' + d.totals.tested + ' 已测</span> <span class="dim">· ' + (d.at||'').slice(0,16).replace('T',' ') + '</span>')
    : ('<span class="warn">尚未运行体检</span> <span class="dim">（本机执行 npm run sources:verify）</span>');
}).catch(function(){ $('health').textContent = '健康度读取失败'; });
load();
</script>
</body>
</html>
