<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>鸿汇影 · 远端配置中心</title>
<style>
  :root{--bg:#0B1220;--card:#121C2E;--line:#22314A;--txt:#DCE6F5;--dim:#93A4BE;--acc:#4C8DFF}
  *{box-sizing:border-box}
  body{margin:0;padding:22px;background:var(--bg);color:var(--txt);font:14px/1.6 "Microsoft YaHei",system-ui,sans-serif}
  h1{font-size:19px;margin:0 0 4px}
  .sub{color:var(--dim);font-size:12.5px;margin-bottom:18px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .card h2{font-size:15px;margin:0 0 10px;display:flex;gap:8px;align-items:center}
  .tag{font:11.5px/1.4 monospace;color:#8FB4FF;border:1px solid #2A4E77;border-radius:8px;padding:1px 6px}
  label{display:block;margin:8px 0 3px;color:var(--dim);font-size:12.5px}
  input[type=text],input[type=datetime-local],select,textarea{width:100%;background:#0F1828;border:1px solid var(--line);
    border-radius:8px;color:var(--txt);padding:7px 9px;font:13px/1.5 inherit}
  textarea{min-height:96px;font-family:Consolas,monospace;font-size:12.5px}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .row>div{flex:1 1 150px;min-width:0}
  .chk{display:flex;gap:8px;align-items:center;margin-top:6px;color:var(--txt)}
  button{background:#1B3A5B;color:#CFE3FF;border:1px solid #2A4E77;border-radius:9px;padding:8px 16px;font:13.5px/1.4 inherit;cursor:pointer}
  button.primary{background:#4C8DFF;border-color:#4C8DFF;color:#fff}
  button.ghost{background:transparent;color:#9CC5FF}
  .bar{position:sticky;bottom:0;margin-top:18px;padding:12px 0;background:linear-gradient(180deg,#0B122000,#0B1220E6 30%);display:flex;gap:10px;align-items:center}
  .msg{font-size:12.5px;color:var(--dim);white-space:pre-wrap;flex:1}
  .ok{color:#5BD48A}.err{color:#FF8B8B}
  pre{background:#0F1828;border:1px solid var(--line);border-radius:8px;padding:10px;overflow:auto;font-size:12px;max-height:260px}
</style>
</head>
<body>
<h1>远端配置中心</h1>
<div class="sub">一份配置管五件事：公告位（#77）· 锁定项（#71）· 远端默认值（#69）· 灰度开关（#70）· 云同步（#66）。客户端只读，改完 bump rev，客户端下次拉取生效。</div>

<div class="grid">
  <div class="card">
    <h2>公告位 <span class="tag">notice · #77</span></h2>
    <div class="chk"><input type="checkbox" id="n_en"><label for="n_en" style="margin:0">启用公告</label></div>
    <label>标题（≤60 字）</label><input type="text" id="n_title" maxlength="60" placeholder="例如：1.7.94 已发布">
    <label>正文（≤400 字）</label><textarea id="n_text" maxlength="400" placeholder="首页横幅上的一句话说明"></textarea>
    <label>跳转链接（可空）</label><input type="text" id="n_link" placeholder="https://… 或 设置页路径">
    <div class="row">
      <div><label>级别</label><select id="n_level"><option value="info">普通</option><option value="event">活动</option><option value="warn">警示</option></select></div>
      <div><label>生效时间（可空）</label><input type="datetime-local" id="n_from"></div>
      <div><label>失效时间（可空）</label><input type="datetime-local" id="n_to"></div>
    </div>
    <div class="chk"><input type="checkbox" id="n_onboard" checked><label for="n_onboard" style="margin:0">首页横幅展示（不勾则只在设置页可见）</label></div>
  </div>

  <div class="card">
    <h2>锁定项 <span class="tag">locks · #71</span></h2>
    <label>每行一个存储键（命中后客户端该项只读并显示 🔒）</label>
    <textarea id="locks" placeholder="kh_audio_lang&#10;kh_notify"></textarea>
    <div class="sub" style="margin:8px 0 0">只锁展示与修改入口，不删除本机已有值。</div>
  </div>

  <div class="card">
    <h2>远端默认值 <span class="tag">defaults · #69</span></h2>
    <label>JSON 对象：键 → 值（客户端仅在「本机没设过」时应用，本机覆盖优先）</label>
    <textarea id="defaults" placeholder='{"kh_audio_lang":"zh","kh_notify":"download"}'></textarea>
  </div>

  <div class="card">
    <h2>灰度开关 <span class="tag">flags · #70</span></h2>
    <label>JSON 对象：id → {on, roll, minVer, maxVer, note}</label>
    <textarea id="flags" placeholder='{"live-reconnect":{"on":true,"roll":30,"minVer":"1.7.90"}}'></textarea>
    <div class="row">
      <div><label>求值预览：设备 ID</label><input type="text" id="p_dev" placeholder="留空按 anon 算"></div>
      <div><label>版本</label><input type="text" id="p_ver" placeholder="1.7.94"></div>
      <div style="flex:0 0 auto;align-self:flex-end"><button class="ghost" id="btnPreview">求值预览</button></div>
    </div>
    <pre id="previewOut">—</pre>
  </div>

  <div class="card">
    <h2>云同步 <span class="tag">sync · #66</span></h2>
    <div class="chk"><input type="checkbox" id="s_en" checked><label for="s_en" style="margin:0">允许客户端推送/拉取偏好</label></div>
    <div class="sub" style="margin:8px 0 0">服务端二次过滤：只收 kh_ 前缀、不含地址与凭证的键；不含影视仓源地址。</div>
    <div class="sub" id="peersOut" style="margin-top:10px">—</div>
  </div>
</div>

<div class="bar">
  <button class="primary" id="btnSave">保存并 bump rev</button>
  <button class="ghost" id="btnReload">重新读取</button>
  <span class="msg" id="msg"></span>
</div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var cfg = null;
  function msg(t, cls) { var m = $('msg'); m.textContent = t; m.className = 'msg ' + (cls || ''); }
  function toLocal(dt) {
    if (!dt) return '';
    var d = new Date(dt);
    if (isNaN(d.getTime())) return '';
    var pad = function (n) { return String(n).padStart(2, '0'); };
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + 'T' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }
  function fromLocal(v) { return v ? new Date(v).toISOString() : ''; }
  function j(v) { try { return JSON.stringify(v, null, 2); } catch (e) { return '{}'; } }

  function render(c) {
    cfg = c;
    var n = c.notice || {};
    $('n_en').checked = !!n.enabled;
    $('n_title').value = n.title || '';
    $('n_text').value = n.text || '';
    $('n_link').value = n.link || '';
    $('n_level').value = n.level || 'info';
    $('n_from').value = toLocal(n.from);
    $('n_to').value = toLocal(n.to);
    $('n_onboard').checked = n.onboard !== false;
    $('locks').value = (c.locks || []).join('\n');
    $('defaults').value = j(c.defaults || {});
    $('flags').value = j(c.flags || {});
    $('s_en').checked = !(c.sync && c.sync.enabled === false);
    msg('已读取 rev ' + c.rev + (c.updatedAt ? ' · ' + c.updatedAt : ''));
  }

  function load() {
    fetch('/api/config/center', { cache: 'no-store' }).then(function (r) { return r.json(); })
      .then(render).catch(function (e) { msg('读取失败 ' + e.message, 'err'); });
    fetch('/api/sync/peers', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (d) {
      if (!d || !d.ok) { $('peersOut').textContent = '云端同步槽：无'; return; }
      var list = (d.peers || []).map(function (p) { return p.device + '（rev ' + p.rev + ' · ' + p.keys + ' 键）'; });
      $('peersOut').textContent = '云端同步槽：' + (list.length ? list.join('；') : '空') + ' · 总 rev ' + d.rev;
    }).catch(function () {});
  }

  function parseJson(id, dft) {
    var t = $(id).value.trim();
    if (!t) return dft;
    return JSON.parse(t);
  }

  $('btnSave').onclick = function () {
    var p;
    try {
      p = {
        notice: {
          enabled: $('n_en').checked, title: $('n_title').value, text: $('n_text').value,
          link: $('n_link').value, level: $('n_level').value, from: fromLocal($('n_from').value),
          to: fromLocal($('n_to').value), onboard: $('n_onboard').checked
        },
        locks: $('locks').value.split('\n').map(function (s) { return s.trim(); }).filter(Boolean),
        defaults: parseJson('defaults', {}),
        flags: parseJson('flags', {}),
        sync: { enabled: $('s_en').checked }
      };
    } catch (e) { msg('JSON 解析失败：' + e.message, 'err'); return; }
    fetch('/api/config/center', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(p)
    }).then(function (r) { return r.json(); }).then(function (d) {
      if (!d.ok) { msg('保存失败：' + (d.error || '未知'), 'err'); return; }
      msg('已保存 · rev ' + d.rev, 'ok');
      load();
    }).catch(function (e) { msg('保存失败 ' + e.message, 'err'); });
  };

  $('btnReload').onclick = load;

  $('btnPreview').onclick = function () {
    var dev = $('p_dev').value.trim() || 'anon';
    var ver = $('p_ver').value.trim();
    var flags;
    try { flags = parseJson('flags', {}); } catch (e) { $('previewOut').textContent = 'flags JSON 解析失败：' + e.message; return; }
    /* 与服务端同一套算法（FNV-1a + 版本区间），这里只为预览；权威值仍以 GET 为准 */
    var bucket = function (d, id) {
      var s = d + '|' + id, h = 2166136261;
      for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = (h * 16777619) >>> 0; }
      return h % 100;
    };
    var vn = function (v) { var m = String(v || '').match(/(\d+)\.(\d+)\.(\d+)/); return m ? (+m[1]) * 10000 + (+m[2]) * 100 + (+m[3]) : null; };
    var out = {};
    Object.keys(flags).forEach(function (id) {
      var f = flags[id] || {}, on = f.on !== false;
      if (on && f.roll != null && +f.roll < 100) on = bucket(dev, id) < +f.roll;
      if (on && (f.minVer || f.maxVer)) {
        var n = vn(ver), lo = vn(f.minVer), hi = vn(f.maxVer);
        if (n != null && lo != null && n < lo) on = false;
        if (n != null && hi != null && n > hi) on = false;
      }
      out[id] = on;
    });
    $('previewOut').textContent = JSON.stringify(out, null, 2);
  };

  load();
})();
</script>
</body>
</html>
