<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>鸿汇影 · 点击即播</title>
<!-- 1.7.97 安全基线：先只报告不拦截（report-only），违规计数存本机，观察后再收紧 -->
<meta http-equiv="Content-Security-Policy-Report-Only" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https: http: ws: wss: file:; img-src 'self' data: blob: https: http: file:; media-src 'self' data: blob: https: http: file:; connect-src * data: blob:; frame-src https: http:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'">
<!-- 骨架屏：首屏在 render 之前显示，避免白屏（1.7.97） -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='14'%20fill='%23FF4D5E'/%3E%3Cpath%20d='M25%2017L46%2032L25%2047Z'%20fill='%23fff'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0C0E16; --card:#171A26; --card2:#1E2230; --line:#262B3B;
  --text:#F2F4FA; --muted:#8A8FA3; --brand:#FF4D5E; --brand2:#FF7A86;
  --ok:#4ADE80; --radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--text); display:flex; flex-direction:column;
  font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
button,input,textarea{font-family:inherit;outline:none}
button{cursor:pointer;border:none;background:none;color:inherit}
:focus-visible{outline:var(--focus-w,2px) solid var(--focus-ring,var(--brand2));outline-offset:var(--focus-off,2px);border-radius:6px}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#2E3448;border-radius:8px}

/* 顶栏 */
.topbar{
  flex:0 0 auto; min-height:64px; display:flex; align-items:center; gap:18px; padding:0 22px;
  background:rgba(12,14,22,.96); border-bottom:1px solid var(--line); z-index:5;
}
.brand{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.brand-mark{
  width:34px;height:34px;border-radius:10px;
  background:linear-gradient(135deg,var(--brand),#FF9A66);
  display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:#fff;
}
.brand-name{font-size:17px;font-weight:800;letter-spacing:1px}
.brand-sub{font-size:10px;color:var(--muted);margin-top:1px}
.search{
  flex:1 1 auto;max-width:420px;display:flex;align-items:center;gap:8px;
  background:var(--card2);border:1px solid var(--line);border-radius:22px;padding:0 12px 0 14px;height:38px;
  transition:border-color .15s,box-shadow .15s;
}
.search:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px rgba(255,77,94,.12)}
.search input{flex:1;min-width:0;background:none;border:none;color:var(--text);font-size:13px}
.search input::placeholder{color:#6C7288}
.search-clear{display:none;font-size:14px;color:var(--muted);width:20px;height:20px;line-height:18px;text-align:center;border-radius:50%;background:#2A3042}
.search-clear.show{display:block}
.search-clear:hover{color:#fff}
.nav{display:flex;align-items:center;gap:4px;flex:0 0 auto;flex-wrap:wrap}
.nav button{font-size:13px;color:var(--muted);padding:8px 13px;border-radius:8px;transition:.15s;white-space:nowrap}
.nav button:hover{color:var(--text);background:var(--card2)}
.nav button.on{color:#fff;background:var(--brand);font-weight:700}
.status{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--muted);flex:0 0 auto;white-space:nowrap}
.status .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.status.busy .dot{background:#FFD166;box-shadow:0 0 8px #FFD166}

/* 主区：flex 自适应，不再硬算顶栏高度 */
#main{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;padding:22px 26px 60px;scroll-behavior:smooth}
.hero{
  position:relative;border-radius:16px;overflow:hidden;min-height:230px;
  display:flex;align-items:flex-end;padding:30px;
  background:linear-gradient(110deg,#243B6B 0%,#1B2340 55%,#0C0E16 100%);
  border:1px solid var(--line);margin-bottom:26px;
}
.hero::after{
  content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 78% 28%,rgba(108,138,228,.45),transparent 45%);pointer-events:none;
}
.hero-inner{position:relative;z-index:1;max-width:600px}
.hero-tag{font-size:11px;color:#FFD166;font-weight:700;letter-spacing:2px}
.hero h1{font-size:34px;margin:10px 0 8px;letter-spacing:1px}
.hero p{font-size:13px;color:#C9CEDC;line-height:1.7;margin-bottom:16px}
.btn-primary{background:var(--brand);color:#fff;font-size:13px;font-weight:700;padding:10px 22px;border-radius:22px;transition:.15s}
.btn-primary:hover{background:var(--brand2);transform:translateY(-1px)}
.btn-ghost{border:1px solid #444B60;color:#D6DAE6;font-size:12px;padding:8px 16px;border-radius:20px;transition:.15s}
.btn-ghost:hover{border-color:var(--brand);color:#fff}

.section-head{display:flex;align-items:baseline;gap:10px;margin:24px 0 12px}
.section-head h2{font-size:17px;font-weight:800}
.section-head span{font-size:11px;color:var(--muted)}
.row{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px;scrollbar-width:thin}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--grid-min,158px),1fr));gap:16px}
.card{flex:0 0 158px;cursor:pointer;transition:transform .18s,opacity .3s;animation:fadeUp .34s both}
/* 触感反馈：点按时轻微缩放；尊重系统减弱动效设置 */
.card:active{transform:scale(.97)}
.ch-card:active{transform:scale(.985)}
.main-fade{animation:mainFade .2s ease}
@keyframes mainFade{from{opacity:.35;transform:translateY(5px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  .main-fade{animation:none}
  .card:active,.ch-card:active{transform:none}
}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card:hover{transform:translateY(-4px)}
.card:focus-visible{outline-offset:4px}
.poster{
  position:relative;width:100%;aspect-ratio:2/3;border-radius:var(--radius);
  overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;
  padding:12px;border:1px solid rgba(255,255,255,.07);
}
.poster::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 72% 22%,rgba(255,255,255,.16),transparent 55%)}
.poster-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.poster.has-cover::after{content:"";position:absolute;left:0;right:0;bottom:0;height:58%;background:linear-gradient(to top,rgba(0,0,0,.74),rgba(0,0,0,0));z-index:1;pointer-events:none}
.poster .badge,.poster .play-badge{z-index:2}
.poster .ptitle{position:relative;z-index:1;font-size:17px;font-weight:800;line-height:1.35;text-shadow:0 2px 8px rgba(0,0,0,.5)}
.poster .psub{position:relative;z-index:1;font-size:10px;color:rgba(255,255,255,.72);margin-top:5px;line-height:1.4}
.poster mark{background:rgba(255,209,102,.28);color:#FFD166;border-radius:3px;padding:0 2px}
.badge{position:absolute;top:9px;left:9px;background:rgba(0,0,0,.55);color:#FFD166;font-size:10px;font-weight:700;padding:3px 7px;border-radius:6px}
.badge-fav{left:auto;right:8px;background:rgba(192,57,43,.88);color:#fff}
.play-badge{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.85);
  width:46px;height:46px;border-radius:50%;background:rgba(255,77,94,.92);
  display:flex;align-items:center;justify-content:center;font-size:19px;color:#fff;
  opacity:0;transition:.18s;box-shadow:0 6px 20px rgba(255,77,94,.45);
}
.card:hover .play-badge,.card:focus-visible .play-badge{opacity:1;transform:translate(-50%,-50%) scale(1)}
.card-meta{margin-top:8px}
.card-meta .t{font-size:12px;font-weight:700;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.35}
.card-meta .s{font-size:10px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-tip{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:6px;padding:12px;background:rgba(8,11,20,.94);opacity:0;transition:opacity .18s;pointer-events:none;border-radius:var(--radius)}
.card:hover .card-tip,.card:focus-visible .card-tip,.card.card-armed .card-tip{opacity:1}
.ct-desc{font-size:11px;line-height:1.55;color:#E7ECF5;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.ct-cast{font-size:10px;color:#9AA6C4}
@media (prefers-reduced-motion:reduce){.card-tip{transition:none}}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 18px}
.chip{font-size:12px;color:var(--muted);background:var(--card2);padding:7px 15px;border-radius:18px;border:1px solid var(--line)}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:700}
.tip{font-size:11px;color:var(--muted);line-height:1.8;margin-top:26px;border-top:1px solid var(--line);padding-top:14px}
.empty{text-align:center;color:var(--muted);padding:64px 0;font-size:13px;line-height:2}
.empty .ico{display:block;font-size:34px;opacity:.5;margin-bottom:10px}
/* 骨架屏（1.7.97）：首屏占位，render 后被真实内容替换；不参与交互 */
.kh-skel{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;padding:22px}
.sk-card{height:150px;border-radius:12px;background:linear-gradient(100deg,#171A26 20%,#1F2434 40%,#171A26 60%);background-size:300% 100%;animation:khSkel 1.4s ease-in-out infinite}
@keyframes khSkel{0%{background-position:100% 0}100%{background-position:0 0}}
@media (prefers-reduced-motion:reduce){.sk-card{animation:none}}
/* 播放页本地短评（1.7.97） */
.kh-rev{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.kh-rev input{flex:1;min-width:180px;background:#141826;border:1px solid #262B3B;border-radius:9px;padding:8px 11px;color:var(--text);font-size:12.5px}
.kh-rev .kh-rev-save{background:#232A3D;border:1px solid #303855;border-radius:9px;padding:7px 13px;font-size:12px}
.kh-rev .kh-rev-last{font-size:12px;color:var(--muted);line-height:1.6;flex-basis:100%}
.kh-rev .kh-rev-last b{color:var(--brand2)}
#khSuggest{position:fixed;z-index:40;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.45);overflow:hidden}
#khSuggest .sg-row{padding:9px 12px;cursor:pointer;font-size:13.5px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
#khSuggest .sg-row:last-child{border-bottom:none}
#khSuggest .sg-row.sg-on{background:var(--card2)}
#khSuggest .sg-clear{padding:7px 12px;font-size:11px;color:var(--muted);text-align:right;border-bottom:1px solid var(--line)}
#khSuggest .sg-clear:hover{color:var(--brand)}
kbd{display:inline-block;background:#252A3A;border:1px solid #3A4156;border-bottom-width:2px;border-radius:5px;padding:1px 6px;font-size:10px;color:#C9CEDC;margin:0 2px}

/* 网址播放卡片 */
.urlcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:20px}
.urlcard h3{font-size:14px;margin-bottom:6px}
.urlcard p{font-size:11px;color:var(--muted);line-height:1.8;margin-bottom:12px}
.urlrow{display:flex;gap:10px;flex-wrap:wrap}
.urlrow input{flex:1 1 300px;min-width:0;background:#0F111B;border:1px solid var(--line);border-radius:8px;color:var(--text);padding:10px 12px;font-size:12px}
.urlrow input:focus{border-color:var(--brand)}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
.quick .lb{font-size:11px;color:var(--muted)}
.qbtn{font-size:11px;color:#C9CEDC;background:var(--card2);border:1px solid var(--line);padding:6px 12px;border-radius:16px;transition:.15s}
.qbtn:hover{border-color:var(--brand);color:#fff}
.keytip{font-size:11px;color:var(--muted);line-height:2;margin-top:14px}

/* 我的网站 */
.sitebox{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:18px}
.sitebox h3{font-size:14px;margin-bottom:6px}
.sitebox p{font-size:11px;color:var(--muted);line-height:1.8;margin-bottom:12px}
.siteform{display:flex;gap:10px;flex-wrap:wrap}
.siteform input{background:#0F111B;border:1px solid var(--line);border-radius:8px;color:var(--text);padding:10px 12px;font-size:12px}
.siteform .n{flex:0 0 160px}
.siteform .u{flex:1 1 260px}
.siteform input:focus{border-color:var(--brand)}
/* 统一表单焦点环：边框跟随主色 + 3px 低透明度环，与搜索框焦点口径一致 */
.urlrow input:focus,.siteform input:focus,.siteform select:focus,.backupbox textarea:focus,.live-form input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(255,77,94,.12)}
.siteform select{background:#0F111B;border:1px solid var(--line);border-radius:8px;color:var(--text);padding:10px 12px;font-size:12px;flex:0 0 110px}
.siteform .w{flex:1 1 100%;min-width:0}
.rescat{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 16px}
.sitetools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.sitelist{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:12px}
.siteitem{display:flex;align-items:center;gap:10px;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:12px;transition:border-color .15s}
.siteitem:hover{border-color:#3A4156}
.siteico{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;color:#fff;flex:0 0 auto}
.sitemeta{flex:1;min-width:0}
.sitemeta .n{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sitemeta .u{font-size:10px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.siteopen{font-size:11px;font-weight:700;color:#fff;background:var(--brand);padding:7px 12px;border-radius:16px;flex:0 0 auto}
.siteopen:hover{background:var(--brand2)}
.mini{font-size:11px;color:var(--muted);padding:5px 6px;border-radius:6px;flex:0 0 auto}
.mini:hover{color:#fff;background:#333A4E}
.sitedel{font-size:12px;color:var(--muted);padding:6px;flex:0 0 auto}
.sitedel:hover{color:var(--brand)}
.builtin{font-size:10px;color:#7C8296;background:#252A3A;padding:2px 7px;border-radius:8px;margin-left:6px}
.pmode{font-size:10px;padding:2px 7px;border-radius:8px;margin-left:6px;white-space:nowrap}
.pmode.wap{color:#4ADE80;background:rgba(74,222,128,.13);border:1px solid rgba(74,222,128,.3)}
.pmode.pc{color:#8AB4F8;background:rgba(138,180,248,.12);border:1px solid rgba(138,180,248,.28)}
.pmode.warn{color:#F5C542;background:rgba(245,197,66,.12);border:1px solid rgba(245,197,66,.3)}
.platnote{font-size:12px;line-height:1.6;color:var(--muted);margin:8px 0 0}
.platnote b{color:#C9CEDC}
/* 快捷键一览表（1.7.95） */
.kbt{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:4px}
.kbt th,.kbt td{border-bottom:1px solid #262B3B;padding:6px 8px;text-align:left;vertical-align:top;line-height:1.5}
.kbt th{color:var(--muted);font-weight:600;background:#171A26;border-bottom:1px solid #2C3345}
.kbt td b{color:#E6EEF9}
/* 电视形态（1.7.95 · 台账 P0-03）：遥控只看得到焦点，所以焦点环必须够粗；字号整体放大一档 */
body.kh-tv{--fs:16px}
body.kh-tv :focus{outline:3px solid #FF7A45;outline-offset:2px;border-radius:6px}
body.kh-tv :focus-visible{outline:3px solid #FF7A45;outline-offset:2px}
body.kh-tv .card:focus,body.kh-tv .ch-card:focus,body.kh-tv .aside-item:focus{transform:scale(1.03);box-shadow:0 0 0 3px rgba(255,122,69,.55),0 8px 24px rgba(0,0,0,.45)}
body.kh-tv .grid{gap:16px}
body.kh-tv .topbar,body.kh-tv .sidebar{font-size:14px}
/* 遥控没有指针，去掉 hover 才出提示的依赖：常驻显示可聚焦项 */
body.kh-tv button,body.kh-tv [data-act]{min-height:36px}
/* 平台实时巡检状态点 */
.pdot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}
.pdot.ok{background:#22C55E;box-shadow:0 0 6px rgba(34,197,94,.55)}
.pdot.down{background:#EF4444;box-shadow:0 0 6px rgba(239,68,68,.55)}
.pdot.ping{background:#F5C542;animation:livePulse 1.2s infinite}
/* 远程同步状态行 */
.syncstat{font-size:12px;color:var(--muted);margin-left:8px}
.syncstat.ok{color:#22C55E}
.syncstat.err{color:#FF7A85}
.backupbox{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.backupbox textarea{width:100%;height:66px;resize:vertical;background:#0F111B;border:1px solid var(--line);border-radius:8px;color:#C9CEDC;padding:8px 10px;font-size:11px;font-family:ui-monospace,monospace}
.confirmbar{margin-top:12px;background:rgba(255,77,94,.12);border:1px solid rgba(255,77,94,.4);border-radius:8px;padding:10px 12px;font-size:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* 播放器：静态分层，控制条不再遮挡画面 */
#playerLayer{position:fixed;inset:0;z-index:20;background:#000;display:none;flex-direction:column}
#playerLayer.show{display:flex}
.player-top{
  flex:0 0 auto;height:52px;display:flex;align-items:center;gap:14px;padding:0 20px;
  background:#0B0D14;border-bottom:1px solid #1B2030;
}
.back,.fav-btn{font-size:12px;color:#fff;background:#262B3B;padding:7px 14px;border-radius:18px;white-space:nowrap}
.back:hover,.fav-btn:hover{background:#39415A}
.player-title{font-size:14px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.video-wrap{position:relative;flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;background:#000;overflow:hidden}
#video{width:100%;height:100%;max-height:100%;object-fit:contain;background:#000;cursor:pointer}
.tap-play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--brand);color:#fff;font-size:15px;font-weight:700;padding:14px 30px;border-radius:28px;box-shadow:0 10px 30px rgba(255,77,94,.45);display:none;z-index:3}
.tap-play.show{display:block}
.buffering{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#FFD166;font-size:12px;background:rgba(0,0,0,.65);padding:8px 16px;border-radius:16px;display:none;z-index:2}
.buffering.show{display:block}
.player-ctrl{flex:0 0 auto;background:#0B0D14;padding:10px 22px 6px;border-top:1px solid #1B2030}
.seek-row{display:flex;align-items:center;gap:12px}
.timetext{font-size:11px;color:#A8AEBC;font-variant-numeric:tabular-nums;white-space:nowrap;min-width:96px;text-align:right}
.ctrl-row{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.cbtn{font-size:12px;color:#E6E9F2;background:#22283A;border:1px solid #2E3448;padding:6px 11px;border-radius:8px;min-width:40px;transition:.15s;white-space:nowrap}
.cbtn:hover{background:#333B54;border-color:#4A5472}
.cbtn.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
.cbtn.play{background:var(--brand);border-color:var(--brand);font-weight:700}
.cbtn.play:hover{background:var(--brand2)}
.volbox{display:flex;align-items:center;gap:7px;font-size:11px;color:#A8AEBC}
.spacer{flex:1 1 auto}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;height:18px;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:#333A50}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:13px;height:13px;border-radius:50%;background:var(--brand);margin-top:-4.5px;box-shadow:0 0 0 3px rgba(255,77,94,.18)}
input[type=range]:focus-visible{outline-offset:4px}
#seek{flex:1 1 auto;min-width:80px}
#vol{width:82px}
.player-extra{flex:0 0 auto;max-height:118px;overflow-y:auto;background:#0B0D14;padding:6px 22px 16px}
/* 播放页右栏推荐（窄屏隐藏，≥1024px 双栏布局时显示） */
.player-aside{display:none}
.aside-head{font-size:13px;font-weight:800;margin:4px 0 10px}
.aside-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.aside-item{cursor:pointer;border-radius:10px;overflow:hidden;background:var(--card2);border:1px solid var(--line);transition:transform .15s,border-color .15s}
.aside-item:hover{transform:translateY(-2px);border-color:var(--brand)}
.aside-item:active{transform:scale(.97)}
.aside-poster{aspect-ratio:2/3;display:flex;align-items:flex-end;padding:8px;font-size:11px;font-weight:800;color:#fff;line-height:1.35;text-shadow:0 1px 6px rgba(0,0,0,.55)}
.aside-meta{font-size:10px;color:var(--muted);padding:5px 7px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srcbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.src-label{font-size:11px;color:#FFD166;background:rgba(255,209,102,.14);padding:4px 10px;border-radius:12px}
.src-btn{font-size:11px;color:#C9CEDC;background:rgba(255,255,255,.12);padding:4px 11px;border-radius:12px}
.src-btn.on{background:var(--brand);color:#fff;font-weight:700}
.src-btn.failed{text-decoration:line-through;opacity:.5}
.player-info{font-size:11px;color:#A8AEBC;line-height:1.7;margin-top:8px;max-width:900px}
.player-msg{font-size:12px;color:#FFD166;margin-top:6px;min-height:16px}

/* ---------------- 电视直播 ---------------- */
.live-hero{
  position:relative;border-radius:16px;overflow:hidden;padding:24px 28px;margin-bottom:20px;
  background:linear-gradient(110deg,#3B1D2A 0%,#241A32 55%,#0C0E16 100%);
  border:1px solid var(--line);display:flex;align-items:center;gap:24px;flex-wrap:wrap;
}
.live-hero::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 82% 24%,rgba(224,49,49,.35),transparent 46%);pointer-events:none}
.live-hero-in{position:relative;z-index:1;flex:1 1 300px}
.live-hero .lh-tag{font-size:11px;color:#FF8A8A;font-weight:800;letter-spacing:2px}
.live-hero h1{font-size:28px;margin:8px 0 7px}
.live-hero p{font-size:12px;color:#C9CEDC;line-height:1.8;max-width:620px}
.live-clock{flex:0 0 auto;text-align:right;position:relative;z-index:1}
.live-clock .t{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:2px}
.live-clock .d{font-size:11px;color:var(--muted);margin-top:3px}
.live-stats{display:flex;gap:18px;margin-top:14px;flex-wrap:wrap}
.live-stats span{font-size:11px;color:#C9CEDC}
.live-stats b{color:#FF8A8A;font-size:15px;margin-right:4px}
.live-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--live-min,238px),1fr));gap:13px}
.ch-card{
  background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;
  transition:transform .18s,border-color .18s;animation:fadeUp .34s both;
  /* 性能：跳过视口外频道的布局与绘制，155 频道全量渲染实测 ~34ms → ~8ms；旧内核自动降级无副作用 */
  content-visibility:auto;contain-intrinsic-size:auto 132px;
}
.ch-card:hover{transform:translateY(-3px);border-color:#4A5472}
.ch-card:focus-visible{outline-offset:3px}
.ch-card.on{border-color:var(--brand);box-shadow:0 0 0 2px rgba(255,77,94,.18)}
.ch-card.off{opacity:.62;cursor:default}
.ch-card.off .ch-logo{filter:grayscale(.6)}
.off-badge{font-size:9px;font-weight:800;letter-spacing:.5px;color:#fff;background:#8A93A6;padding:2px 6px;border-radius:4px;flex:0 0 auto}
.ch-top{display:flex;align-items:center;gap:11px}
.ch-logo{
  width:44px;height:44px;border-radius:11px;flex:0 0 auto;display:flex;align-items:center;
  justify-content:center;font-size:18px;font-weight:800;color:#fff;letter-spacing:1px;
}
.ch-meta{flex:1;min-width:0}
.ch-name{font-size:14px;font-weight:800;display:flex;align-items:center;gap:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live-dot{font-size:9px;font-weight:800;letter-spacing:1px;color:#fff;background:#E03131;padding:2px 6px;border-radius:4px;flex:0 0 auto}
.live-dot::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:#fff;margin-right:4px;vertical-align:1px;animation:livePulse 1.3s infinite}
@keyframes livePulse{0%,100%{opacity:1}50%{opacity:.25}}
.ch-sub{font-size:10px;color:var(--muted);margin-top:4px}
.ch-fav{font-size:17px;color:#6C7288;padding:4px;flex:0 0 auto}
.ch-fav:hover,.ch-fav.on{color:#FFD166}
.ch-epg{margin-top:12px;padding-top:11px;border-top:1px dashed var(--line);font-size:11px;line-height:1.9}
.epg-now{color:#E6E9F2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.epg-now b{color:#FFD166;font-weight:700}
.epg-track{height:3px;background:#2E3448;border-radius:3px;margin:7px 0 6px;overflow:hidden}
.epg-track i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),#FF9A66);border-radius:3px}
.epg-next{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-tools{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 18px;align-items:center}
.ch-tools .lb{font-size:11px;color:var(--muted)}
.live-form input.g{flex:0 0 150px}
.live-note{font-size:11px;color:var(--muted);line-height:1.9;margin-top:14px;background:rgba(255,209,102,.06);border:1px solid rgba(255,209,102,.18);border-radius:8px;padding:10px 12px}

/* 播放器直播态：隐藏进度/倍速/快进退，显示切台条 */
.livebar{display:none;align-items:center;gap:9px;flex-wrap:wrap;padding:2px 0 8px}
.livebar.show{display:flex}
.live-mode .seek-row{display:none}
.live-mode [data-ctrl="back10"],.live-mode [data-ctrl="fwd10"],.live-mode [data-ctrl="rate"]{display:none}
.live-searchbox{display:flex;align-items:center;gap:8px;margin:0 0 16px;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.live-searchbox span{color:#7C8296;font-size:13px}
.live-searchbox input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:#E8EBF2;font-size:13px}
.net-badge{font-size:9px;margin-left:6px;padding:2px 6px;border-radius:8px;background:rgba(230,126,34,.18);color:#F0A35A;border:1px solid rgba(230,126,34,.4);vertical-align:middle;white-space:nowrap}
.lb-live{font-size:10px;font-weight:800;letter-spacing:1px;color:#fff;background:#E03131;padding:5px 9px;border-radius:6px;white-space:nowrap}
.lb-ch{font-size:13px;font-weight:800;color:#F2F4FA;white-space:nowrap}
.lb-epg{font-size:11px;color:#FFD166;flex:1 1 180px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-clock{font-size:11px;color:#A8AEBC;font-variant-numeric:tabular-nums;white-space:nowrap}
@media (max-width:520px){
  .live-hero{padding:18px}.live-hero h1{font-size:22px}.live-clock{text-align:left}
  .live-hero-in{flex:1 1 100%;min-width:0}
  .live-hero p{max-width:100%}
  .live-stats{gap:10px 14px}
  .live-grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
  .live-form input.g{flex-basis:100%}
}
@media (prefers-reduced-motion:reduce){.live-dot::before{animation:none}}

/* 通用 */
.toast{
  position:fixed;left:50%;bottom:96px;transform:translateX(-50%);
  background:rgba(30,34,48,.97);border:1px solid var(--line);color:#fff;
  font-size:12px;padding:9px 14px;border-radius:20px;z-index:30;
  opacity:0;pointer-events:none;transition:.25s;display:flex;align-items:center;gap:12px;white-space:nowrap;
}
.toast.show{opacity:1;pointer-events:auto}
.toast button{font-size:11px;font-weight:700;color:#FFD166;background:rgba(255,209,102,.14);padding:4px 10px;border-radius:12px}
.toast button:hover{background:rgba(255,209,102,.28)}
/* 手势提示 HUD（#122）：滑动调音量/亮度、长按倍速时居中短暂显示 */
.kh-gesture-hud{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:45;background:rgba(12,15,22,.86);border:1px solid var(--line);color:#fff;font-size:14px;font-weight:600;padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .18s;white-space:nowrap}
.kh-gesture-hud.show{opacity:1}
/* 导入备份冲突策略选择浮层（#121） */
.kh-ask-mask{position:fixed;inset:0;z-index:70;background:rgba(8,10,16,.62);display:flex;align-items:center;justify-content:center;padding:20px}
.kh-ask{width:min(460px,94vw);max-height:86vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 46px rgba(0,0,0,.55);padding:18px 18px 14px}
.kh-ask h3{font-size:15px;margin:0 0 6px;color:var(--text)}
.kh-ask .kh-ask-sub{font-size:12px;line-height:1.7;color:var(--muted);margin:0 0 12px}
.kh-ask .kh-ask-btn{display:block;width:100%;text-align:left;margin:0 0 8px;padding:11px 13px;background:var(--card2);border:1px solid var(--line);border-radius:10px;color:var(--text);font-size:13px;line-height:1.5;cursor:pointer}
.kh-ask .kh-ask-btn:hover,.kh-ask .kh-ask-btn:focus-visible{border-color:var(--accent);outline:none}
.kh-ask .kh-ask-btn b{display:block;font-size:13px;margin-bottom:2px}
.kh-ask .kh-ask-btn span{font-size:11.5px;color:var(--muted)}
.kh-ask .kh-ask-cancel{background:transparent;text-align:center;color:var(--muted);margin-top:2px}
/* 设备端备份导出 / 粘贴导入（#130）：长文本区与按钮行 */
.kh-exp-area{width:100%;box-sizing:border-box;height:150px;resize:vertical;background:var(--card2);border:1px solid var(--line);border-radius:9px;color:var(--text);font-size:11.5px;line-height:1.6;padding:9px 10px;font-family:ui-monospace,Menlo,Consolas,monospace}
.kh-exp-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
.kh-exp-btns .qbtn{min-width:84px}
.kh-shot-row{display:flex;flex-direction:column;gap:2px;padding:8px 10px;margin-bottom:6px;background:var(--card2);border:1px solid var(--line);border-radius:9px}
.kh-shot-row b{font-size:12.5px;color:var(--text)}
.kh-shot-row span{font-size:11px;color:var(--muted)}
/* 卡片 / 频道右键上下文菜单 */
.ctx-menu{position:fixed;z-index:60;min-width:168px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 36px rgba(0,0,0,.5);padding:6px;display:none}
.ctx-menu.show{display:block}
.ctx-menu .cm-item{display:flex;align-items:center;gap:9px;padding:9px 12px;font-size:13px;color:var(--text);border-radius:8px;cursor:pointer;white-space:nowrap}
.ctx-menu .cm-item:hover{background:var(--card2)}
.ctx-menu .cm-item.cm-on{background:var(--card2)}
.ctx-menu .cm-item.cm-off{color:var(--muted);cursor:default}
.ctx-menu .cm-item.cm-off:hover{background:transparent}
.ctx-menu .cm-sep{height:1px;background:var(--line);margin:5px 8px}
#toTop{
  position:fixed;right:24px;bottom:24px;z-index:8;width:38px;height:38px;border-radius:50%;
  background:var(--card2);border:1px solid var(--line);color:#D6DAE6;font-size:16px;display:none;
  box-shadow:0 6px 20px rgba(0,0,0,.4);
}
#toTop.show{display:block}
#toTop:hover{border-color:var(--brand);color:#fff}
#diag{display:none}

/* 电脑端适配：≥1024px 限宽居中、卡片放大 */
@media (min-width:1024px){
  #main{max-width:1560px;align-self:center;width:100%;padding:26px 36px 64px}
  /* 播放页双栏：左视频+控制条，右栏（片源/简介/相关推荐）固定 360px 可滚动 */
  #playerLayer.show{
    display:grid;
    grid-template-columns:1fr 360px;
    grid-template-rows:52px minmax(0,1fr) auto;
    grid-template-areas:"top top" "video side" "ctrl side";
  }
  .player-top{grid-area:top}
  .video-wrap{grid-area:video}
  .player-ctrl{grid-area:ctrl}
  .player-extra{grid-area:side;max-height:none;overflow-y:auto;border-left:1px solid #1B2030}
  .player-aside{display:block}
  .grid{grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:18px}
  .row .card{flex-basis:196px}
  .section-head h2{font-size:19px}
  .sitelist{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
}
/* 宽屏 / 高分屏：≥1600px 进一步放大版面 */
@media (min-width:1600px){
  #main{max-width:1760px;padding:30px 44px 72px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(216px,1fr));gap:20px}
  .row .card{flex-basis:216px}
  .hero{min-height:290px;padding:36px}
  .hero h1{font-size:42px}
  .hero p{font-size:14px}
  .section-head h2{font-size:20px}
  .sitelist{grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px}
  /* 2K/4K 超宽档：内容与控制栏限宽居中，海报更密 */
  .player-ctrl .seek-row,.player-ctrl .ctrl-row,.player-extra .player-info{max-width:1500px;margin-left:auto;margin-right:auto}
}
/* 4K / 超宽显示器：≥2200px 最高密度档 */
@media (min-width:2200px){
  #main{max-width:1960px;padding:34px 52px 80px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:22px}
  .row .card{flex-basis:232px}
  .sitelist{grid-template-columns:repeat(auto-fill,minmax(400px,1fr))}
  .hero{min-height:320px}
  .hero h1{font-size:46px}
}
/* 小笔记本 / 半屏窗口：矮视口压缩纵向占用（浏览器工具栏会吃掉 100~200px 高度） */
@media (min-width:1024px) and (max-height:820px){
  #main{padding-top:20px}
  .hero{min-height:210px;padding:24px}
  .hero h1{font-size:30px}
  .hero p{margin-bottom:12px}
}
@media (min-width:1024px) and (max-height:680px){
  .hero{min-height:170px;padding:18px}
  .hero h1{font-size:25px}
  .section-head{margin:18px 0 10px}
}
/* 901~1180 中间档：旧笔记本半屏 / 1024×768 横屏，收窄顶栏防换行 */
@media (min-width:901px) and (max-width:1180px){
  .topbar{gap:10px;padding:0 14px}
  .brand-sub{display:none}
  .nav button{padding:8px 9px;font-size:12px}
  .status{max-width:150px;overflow:hidden;text-overflow:ellipsis}
}
/* 触屏笔记本：无悬停能力时关掉悬停位移，避免「粘住」 */
@media (hover:none){
  .card:hover{transform:none}
}
/* Firefox 桌面端滚动条 */
html{scrollbar-width:thin;scrollbar-color:#2E3448 transparent}
/* 电脑端：卡片行支持鼠标滚轮横向滚动（在行上滚动即横滚） */
.row{scroll-behavior:smooth}

@media (max-width:900px){
  .topbar{flex-wrap:wrap;padding:10px 14px;gap:10px;min-height:0}
  .status{display:none}
  .search{max-width:none;order:3;flex-basis:100%}
  #main{padding:16px 14px 50px}
  .hero{min-height:190px;padding:20px}.hero h1{font-size:26px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
  .card{flex-basis:130px}.poster .ptitle{font-size:14px}
  .nav button{padding:7px 10px;font-size:12px}
  .player-ctrl,.player-extra{padding-left:14px;padding-right:14px}
  .timetext{min-width:84px;font-size:10px}
  #vol{width:60px}
}
@media (max-width:520px){
  .brand-sub{display:none}
  .nav{gap:2px}.nav button{padding:6px 8px;font-size:11px}
  .ctrl-row{gap:5px}.cbtn{padding:5px 8px;min-width:34px;font-size:11px}
  .siteform .n{flex-basis:100%}
  .toast{white-space:normal;max-width:calc(100vw - 32px)}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
/* 1.7.90 界面动效开关（清单 #50）：设置里关掉动效时挂这个类，只禁动画过渡，不禁任何功能 */
html.kh-no-motion *{animation:none!important;transition:none!important;scroll-behavior:auto!important}
/* 夜间模式：由 khApplyDisplay 挂一层 fixed 暖色 multiply 遮罩（不用 filter，避免改变 fixed 定位包含块） */
/* 浅色主题：覆盖同一套变量，整页跟随；遮罩式夜间模式与浅色互斥（khApplyDisplay 保证） */
body.kh-light{
  --bg:#F4F6FB; --card:#FFFFFF; --card2:#EDF1F8; --line:#DCE3EF;
  --text:#16203A; --muted:#5C6780;
}
body.kh-light .topbar{background:#FFFFFF;border-bottom-color:#DCE3EF;}
body.kh-light .player-layer,body.kh-light #playerLayer{background:#F4F6FB;color:#16203A;}
/* 浅色主题：表单控件、标签与悬浮态跟随变量，避免深底深字 */
body.kh-light .urlrow input,body.kh-light .siteform input,body.kh-light .siteform select,body.kh-light .backupbox textarea{background:var(--card);color:var(--text);border-color:var(--line);}
body.kh-light .backupbox textarea{color:var(--text);}
body.kh-light .search-clear{background:var(--card2);color:var(--muted);}
body.kh-light kbd{background:var(--card2);border-color:var(--line);color:var(--muted);}
body.kh-light .builtin{background:var(--card2);color:var(--muted);}
body.kh-light .mini:hover{color:var(--text);background:var(--card2);}
body.kh-light .siteitem:hover{border-color:var(--brand);}
/* 多套深色皮肤：仅覆盖调色板变量，结构/字号/间距不变；与默认深色同属深底，控件硬编码深底不冲突 */
body.kh-ocean{--bg:#0A1420;--card:#12202F;--card2:#182B3D;--line:#24384B;--text:#EDF3FA;--muted:#8BA1B5;--brand:#38BDF8;--brand2:#7DD3FC;}
body.kh-forest{--bg:#0B1512;--card:#13221C;--card2:#1A2E25;--line:#274034;--text:#ECF5EF;--muted:#8CA89A;--brand:#34D399;--brand2:#6EE7B7;}
body.kh-violet{--bg:#120F1E;--card:#1C1730;--card2:#251E3D;--line:#342A52;--text:#F1EEFB;--muted:#A296C4;--brand:#A78BFA;--brand2:#C4B5FD;}
body.kh-mono{--bg:#111214;--card:#1A1C1F;--card2:#222529;--line:#30343A;--text:#F0F1F3;--muted:#969AA2;--brand:#8AA0C0;--brand2:#B6C6DE;}
body.kh-sand{--bg:#17120C;--card:#221A12;--card2:#2C2218;--line:#3D2F20;--text:#F6F0E6;--muted:#B39E86;--brand:#F0A868;--brand2:#F7C394;}
body.kh-rose{--bg:#1A0F14;--card:#27161D;--card2:#331E27;--line:#472A36;--text:#F8EEF1;--muted:#BC93A0;--brand:#FB7185;--brand2:#FDA4AF;}
body.kh-slate{--bg:#0E1518;--card:#162125;--card2:#1E2C31;--line:#2C3E44;--text:#ECF3F4;--muted:#8FA6AB;--brand:#2DD4BF;--brand2:#5EEAD4;}
/* 字幕层：贴在视频底部，本机渲染，不依赖片源 CORS；字号与高度来自设置（kh_sub_style） */
.sub-layer{position:absolute;left:0;right:0;bottom:var(--sub-bottom,8%);z-index:6;pointer-events:none;text-align:center;padding:0 6%;}

    <button data-view="settings">⚙ 设置</button>
    <button data-view="about">关于</button>
  </div>
  <div class="status" id="statusWrap"><span class="dot"></span><span id="statusText">资源加载中…</span></div>
</div>

<div id="main"><div class="kh-skel" aria-hidden="true"><div class="sk-card"></div><div class="sk-card"></div><div class="sk-card"></div><div class="sk-card"></div><div class="sk-card"></div><div class="sk-card"></div></div></div>
<button id="toTop" aria-label="回到顶部">↑</button>

<div id="playerLayer">
  <div class="player-top">
    <button class="back" id="closeBtn">‹ 返回</button>
    <div class="player-title" id="playerTitle">—</div>
    <button class="fav-btn" id="favBtn">☆ 收藏</button>
  </div>
  <div class="video-wrap" id="videoWrap">
    <video id="video" playsinline webkit-playsinline preload="auto"></video>
    <div class="sub-layer" id="subLayer" aria-live="polite"></div>
    <button id="tapPlay" class="tap-play">▶ 点击播放</button>
    <div class="buffering" id="buffering">正在缓冲…</div>
  </div>
  <div class="player-ctrl">
    <div class="seek-row">
      <input id="seek" type="range" min="0" max="100" step="0.1" value="0" aria-label="播放进度">
      <span class="timetext" id="timeText">00:00 / 00:00</span>
    </div>
    <div class="livebar" id="liveBar">
      <span class="lb-live">● LIVE</span>
      <span class="lb-ch" id="lbCh">CH —</span>
      <span class="lb-epg" id="lbEpg">正在直播 —</span>
      <span class="lb-clock" id="lbClock">--:--:--</span>
      <span class="spacer"></span>
      <button class="cbtn" data-ctrl="live-prev" title="上一台">▲ 上一台</button>
      <button class="cbtn" data-ctrl="live-next" title="下一台">▼ 下一台</button>
      <button class="cbtn" data-ctrl="live-fav" id="lbFav">☆ 收藏</button>
      <button class="cbtn" data-ctrl="live-list" title="返回频道列表">▦ 频道</button>
    </div>
    <div class="ctrl-row">
      <button class="cbtn play" data-ctrl="play" id="btnPlay" aria-label="播放或暂停">▶</button>
      <button class="cbtn" data-ctrl="back10" title="后退 10 秒">«10s</button>
      <button class="cbtn" data-ctrl="fwd10" title="前进 10 秒">10s»</button>
      <div class="volbox">
        <button class="cbtn" data-ctrl="mute" id="btnMute" aria-label="静音切换">🔊</button>
        <input id="vol" type="range" min="0" max="1" step="0.05" value="1" aria-label="音量">
      </div>
      <span class="spacer"></span>
      <button class="cbtn" data-ctrl="rate" id="btnRate" title="切换倍速">1.0×</button>
      <button class="cbtn" id="btnIntro" title="跳过片头：已记过就直接跳；没记过则把当前位置记为本片片头">⏭ 片头</button>
      <button class="cbtn" id="btnAB" title="A-B 循环：第一下设 A，第二下设 B，第三下取消">🔁 A-B</button>
      <button class="cbtn" data-ctrl="fullscreen" title="全屏">⛶ 全屏</button>
      <button class="cbtn" data-ctrl="fit" id="btnFit" title="画面比例：自适应 / 铺满裁剪 / 拉伸">🖍 自适应</button>
      <button class="cbtn" data-ctrl="pip" title="画中画">🖼 画中画</button>
      <button class="cbtn" data-ctrl="quality" id="btnQuality" title="切换清晰度（HLS 多码率时可用）">🎚 自动</button>
      <button class="cbtn" data-ctrl="downgrade" id="btnDown" title="手动降低一档清晰度（弱网 / 卡顿）">⬇ 降档</button>
      <button class="cbtn" data-ctrl="subtitle" id="btnSubtitle" title="加载字幕（支持 .srt / .vtt，本机渲染）">📝 字幕</button>
      <button class="cbtn" data-ctrl="sub-translate" id="btnSubTrans" title="把当前字幕翻译成中文">🌐 译</button>
      <button class="cbtn" data-ctrl="audiotrack" id="btnAudioTrack" title="切换音轨（HLS 多音轨时可用）">🎵 音轨</button>
      <button class="cbtn" data-ctrl="shot" id="btnShot" title="截取当前画面并存到本机">📷 截图</button>
      <button class="cbtn" data-ctrl="watchlater" id="btnWatchLater" title="加入稍后再看（收藏页可见）">⏰ 稍后看</button>
      <button class="cbtn" data-ctrl="watchsub" id="btnWatchSub" title="追剧订阅（本机记录，片单快照变化时提醒）">⭐ 追剧</button>
      <button class="cbtn" data-ctrl="external" id="btnExternal" title="用本机外部播放器（VLC / mpv / 系统默认）打开当前片源">🖥 外播</button>
      <button class="cbtn" data-ctrl="cast" id="btnCast" title="投屏到电视 / 盒子（DLNA，仅桌面版，需同一局域网）">📺 投屏</button>
      <button class="cbtn" data-ctrl="dl-current" id="btnDlCurrent" title="把当前片源加入下载队列（继承防盗链头，仅桌面版）">⬇ 下载</button>
      <button class="cbtn" data-ctrl="openfile" id="btnOpenFile" title="打开本机视频文件（仅桌面版）">📂 本机</button>
    </div>
  </div>
  <div class="player-extra">
    <div class="player-aside" id="playerAside">
      <div class="aside-head">相关推荐 · 点击换片</div>
      <div class="aside-list" id="asideList"></div>
    </div>
    <div class="srcbar" id="srcBar"></div>
    <div class="player-info" id="playerInfo"></div>
    <div class="kh-rev" id="khRevBox" style="display:none">
      <input id="khRevInput" type="text" maxlength="60" placeholder="写一句短评（只存本机，不上传）" autocomplete="off">
      <button class="kh-rev-save" id="khRevSave">保存</button>
      <div class="kh-rev-last" id="khRevLast"></div>
    </div>
    <div class="player-msg" id="playerMsg"></div>
  </div>
</div>

<div class="toast" id="toast"><span id="toastText"></span><button id="toastAction" style="display:none"></button></div>
<div class="ctx-menu" id="khCtxMenu"></div>
<div id="diag" data-state="idle" data-cards="0" data-sites="0" data-live="0" data-hls="" data-source="" data-ready="0" data-render="0" data-boot="0" data-error="0" data-rate="1" data-volume="1" data-muted="0" data-watchdog="0" data-livemode="live"></div>

 <script src="kh-backup.js"></script>
<script src="kh-config.js"></script>
<script src="kh-core.js"></script>
<script src="kh-src.js"></script>
<script src="kh-admin.js"></script>
<script src="kh-player.js"></script>
<script src="kh-app.js"></script>
<script src="kh-extras.js"></script>
</body>
