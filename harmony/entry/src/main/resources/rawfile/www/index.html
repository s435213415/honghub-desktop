<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>鸿汇影 · 点击即播</title>
<style>
:root{
  --bg:#0C0E16; --card:#171A26; --card2:#1E2230; --line:#262B3B;
  --text:#F2F4FA; --muted:#8A8FA3; --brand:#FF4D5E; --brand2:#FF7A86;
  --ok:#4ADE80; --radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--text); display:flex; flex-direction:column;
  font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased; overflow:hidden;
}
button,input,textarea{font-family:inherit;outline:none}
button{cursor:pointer;border:none;background:none;color:inherit}
:focus-visible{outline:2px solid var(--brand2);outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#2E3448;border-radius:8px}

/* 顶栏 */
.topbar{
  flex:0 0 auto; min-height:64px; display:flex; align-items:center; gap:18px; padding:0 22px;
  background:rgba(12,14,22,.96); border-bottom:1px solid var(--line); z-index:5;
}
.brand{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.brand-mark{
  width:34px;height:34px;border-radius:10px;
  background:linear-gradient(135deg,var(--brand),#FF9A66);
  display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:#fff;
}
.brand-name{font-size:17px;font-weight:800;letter-spacing:1px}
.brand-sub{font-size:10px;color:var(--muted);margin-top:1px}
.search{
  flex:1 1 auto;max-width:420px;display:flex;align-items:center;gap:8px;
  background:var(--card2);border:1px solid var(--line);border-radius:22px;padding:0 12px 0 14px;height:38px;
  transition:border-color .15s,box-shadow .15s;
}
.search:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px rgba(255,77,94,.12)}
.search input{flex:1;min-width:0;background:none;border:none;color:var(--text);font-size:13px}
.search input::placeholder{color:#6C7288}
.search-clear{display:none;font-size:14px;color:var(--muted);width:20px;height:20px;line-height:18px;text-align:center;border-radius:50%;background:#2A3042}
.search-clear.show{display:block}
.search-clear:hover{color:#fff}
.nav{display:flex;align-items:center;gap:4px;flex:0 0 auto;flex-wrap:wrap}
.nav button{font-size:13px;color:var(--muted);padding:8px 13px;border-radius:8px;transition:.15s;white-space:nowrap}
.nav button:hover{color:var(--text);background:var(--card2)}
.nav button.on{color:#fff;background:var(--brand);font-weight:700}
.status{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--muted);flex:0 0 auto;white-space:nowrap}
.status .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.status.busy .dot{background:#FFD166;box-shadow:0 0 8px #FFD166}

/* 主区：flex 自适应，不再硬算顶栏高度 */
#main{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;padding:22px 26px 60px;scroll-behavior:smooth}
.hero{
  position:relative;border-radius:16px;overflow:hidden;min-height:230px;
  display:flex;align-items:flex-end;padding:30px;
  background:linear-gradient(110deg,#243B6B 0%,#1B2340 55%,#0C0E16 100%);
  border:1px solid var(--line);margin-bottom:26px;
}
.hero::after{
  content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 78% 28%,rgba(108,138,228,.45),transparent 45%);pointer-events:none;
}
.hero-inner{position:relative;z-index:1;max-width:600px}
.hero-tag{font-size:11px;color:#FFD166;font-weight:700;letter-spacing:2px}
.hero h1{font-size:34px;margin:10px 0 8px;letter-spacing:1px}
.hero p{font-size:13px;color:#C9CEDC;line-height:1.7;margin-bottom:16px}
.btn-primary{background:var(--brand);color:#fff;font-size:13px;font-weight:700;padding:10px 22px;border-radius:22px;transition:.15s}
.btn-primary:hover{background:var(--brand2);transform:translateY(-1px)}
.btn-ghost{border:1px solid #444B60;color:#D6DAE6;font-size:12px;padding:8px 16px;border-radius:20px;transition:.15s}
.btn-ghost:hover{border-color:var(--brand);color:#fff}

.section-head{display:flex;align-items:baseline;gap:10px;margin:24px 0 12px}
.section-head h2{font-size:17px;font-weight:800}
.section-head span{font-size:11px;color:var(--muted)}
.row{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px;scrollbar-width:thin}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:16px}
.card{flex:0 0 158px;cursor:pointer;transition:transform .18s,opacity .3s;animation:fadeUp .34s both}
/* 触感反馈：点按时轻微缩放；尊重系统减弱动效设置 */
.card:active{transform:scale(.97)}
.ch-card:active{transform:scale(.985)}
.main-fade{animation:mainFade .2s ease}
@keyframes mainFade{from{opacity:.35;transform:translateY(5px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  .main-fade{animation:none}
  .card:active,.ch-card:active{transform:none}
}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card:hover{transform:translateY(-4px)}
.card:focus-visible{outline-offset:4px}
.poster{
  position:relative;width:100%;aspect-ratio:2/3;border-radius:var(--radius);
  overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;
  padding:12px;border:1px solid rgba(255,255,255,.07);
}
.poster::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 72% 22%,rgba(255,255,255,.16),transparent 55%)}
.poster .ptitle{position:relative;font-size:17px;font-weight:800;line-height:1.35;text-shadow:0 2px 8px rgba(0,0,0,.5)}
.poster .psub{position:relative;font-size:10px;color:rgba(255,255,255,.72);margin-top:5px;line-height:1.4}
.poster mark{background:rgba(255,209,102,.28);color:#FFD166;border-radius:3px;padding:0 2px}
.badge{position:absolute;top:9px;left:9px;background:rgba(0,0,0,.55);color:#FFD166;font-size:10px;font-weight:700;padding:3px 7px;border-radius:6px}
.play-badge{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.85);
  width:46px;height:46px;border-radius:50%;background:rgba(255,77,94,.92);
  display:flex;align-items:center;justify-content:center;font-size:19px;color:#fff;
  opacity:0;transition:.18s;box-shadow:0 6px 20px rgba(255,77,94,.45);
}
.card:hover .play-badge,.card:focus-visible .play-badge{opacity:1;transform:translate(-50%,-50%) scale(1)}
.card-meta{margin-top:8px}
.card-meta .t{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-meta .s{font-size:10px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 18px}
.chip{font-size:12px;color:var(--muted);background:var(--card2);padding:7px 15px;border-radius:18px;border:1px solid var(--line)}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:700}
.tip{font-size:11px;color:var(--muted);line-height:1.8;margin-top:26px;border-top:1px solid var(--line);padding-top:14px}
.empty{text-align:center;color:var(--muted);padding:64px 0;font-size:13px;line-height:2}
.empty .ico{display:block;font-size:34px;opacity:.5;margin-bottom:10px}
kbd{display:inline-block;background:#252A3A;border:1px solid #3A4156;border-bottom-width:2px;border-radius:5px;padding:1px 6px;font-size:10px;color:#C9CEDC;margin:0 2px}

/* 网址播放卡片 */
.urlcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:20px}
.urlcard h3{font-size:14px;margin-bottom:6px}
.urlcard p{font-size:11px;color:var(--muted);line-height:1.8;margin-bottom:12px}
.urlrow{display:flex;gap:10px;flex-wrap:wrap}
.urlrow input{flex:1 1 300px;min-width:0;background:#0F111B;border:1px solid var(--line);border-radius:8px;color:var(--text);padding:10px 12px;font-size:12px}
.urlrow input:focus{border-color:var(--brand)}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
.quick .lb{font-size:11px;color:var(--muted)}
.qbtn{font-size:11px;color:#C9CEDC;background:var(--card2);border:1px solid var(--line);padding:6px 12px;border-radius:16px;transition:.15s}
.qbtn:hover{border-color:var(--brand);color:#fff}
.keytip{font-size:11px;color:var(--muted);line-height:2;margin-top:14px}

/* 我的网站 */
.sitebox{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:18px}
.sitebox h3{font-size:14px;margin-bottom:6px}
.sitebox p{font-size:11px;color:var(--muted);line-height:1.8;margin-bottom:12px}
.siteform{display:flex;gap:10px;flex-wrap:wrap}
.siteform input{background:#0F111B;border:1px solid var(--line);border-radius:8px;color:var(--text);padding:10px 12px;font-size:12px}
.siteform .n{flex:0 0 160px}
.siteform .u{flex:1 1 260px}
.siteform input:focus{border-color:var(--brand)}
.siteform select{background:#0F111B;border:1px solid var(--line);border-radius:8px;color:var(--text);padding:10px 12px;font-size:12px;flex:0 0 110px}
.siteform .w{flex:1 1 100%;min-width:0}
.rescat{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 16px}
.sitetools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.sitelist{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:12px}
.siteitem{display:flex;align-items:center;gap:10px;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:12px;transition:border-color .15s}
.siteitem:hover{border-color:#3A4156}
.siteico{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;color:#fff;flex:0 0 auto}
.sitemeta{flex:1;min-width:0}
.sitemeta .n{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sitemeta .u{font-size:10px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.siteopen{font-size:11px;font-weight:700;color:#fff;background:var(--brand);padding:7px 12px;border-radius:16px;flex:0 0 auto}
.siteopen:hover{background:var(--brand2)}
.mini{font-size:11px;color:var(--muted);padding:5px 6px;border-radius:6px;flex:0 0 auto}
.mini:hover{color:#fff;background:#333A4E}
.sitedel{font-size:12px;color:var(--muted);padding:6px;flex:0 0 auto}
.sitedel:hover{color:var(--brand)}
.builtin{font-size:10px;color:#7C8296;background:#252A3A;padding:2px 7px;border-radius:8px;margin-left:6px}
.pmode{font-size:10px;padding:2px 7px;border-radius:8px;margin-left:6px;white-space:nowrap}
.pmode.wap{color:#4ADE80;background:rgba(74,222,128,.13);border:1px solid rgba(74,222,128,.3)}
.pmode.pc{color:#8AB4F8;background:rgba(138,180,248,.12);border:1px solid rgba(138,180,248,.28)}
.pmode.warn{color:#F5C542;background:rgba(245,197,66,.12);border:1px solid rgba(245,197,66,.3)}
.platnote{font-size:12px;line-height:1.6;color:var(--muted);margin:8px 0 0}
.platnote b{color:#C9CEDC}
/* 平台实时巡检状态点 */
.pdot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}
.pdot.ok{background:#22C55E;box-shadow:0 0 6px rgba(34,197,94,.55)}
.pdot.down{background:#EF4444;box-shadow:0 0 6px rgba(239,68,68,.55)}
.pdot.ping{background:#F5C542;animation:livePulse 1.2s infinite}
/* 远程同步状态行 */
.syncstat{font-size:12px;color:var(--muted);margin-left:8px}
.syncstat.ok{color:#22C55E}
.syncstat.err{color:#FF7A85}
.backupbox{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.backupbox textarea{width:100%;height:66px;resize:vertical;background:#0F111B;border:1px solid var(--line);border-radius:8px;color:#C9CEDC;padding:8px 10px;font-size:11px;font-family:ui-monospace,monospace}
.confirmbar{margin-top:12px;background:rgba(255,77,94,.12);border:1px solid rgba(255,77,94,.4);border-radius:8px;padding:10px 12px;font-size:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* 播放器：静态分层，控制条不再遮挡画面 */
#playerLayer{position:fixed;inset:0;z-index:20;background:#000;display:none;flex-direction:column}
#playerLayer.show{display:flex}
.player-top{
  flex:0 0 auto;height:52px;display:flex;align-items:center;gap:14px;padding:0 20px;
  background:#0B0D14;border-bottom:1px solid #1B2030;
}
.back,.fav-btn{font-size:12px;color:#fff;background:#262B3B;padding:7px 14px;border-radius:18px;white-space:nowrap}
.back:hover,.fav-btn:hover{background:#39415A}
.player-title{font-size:14px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.video-wrap{position:relative;flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;background:#000;overflow:hidden}
#video{width:100%;height:100%;max-height:100%;object-fit:contain;background:#000;cursor:pointer}
.tap-play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--brand);color:#fff;font-size:15px;font-weight:700;padding:14px 30px;border-radius:28px;box-shadow:0 10px 30px rgba(255,77,94,.45);display:none;z-index:3}
.tap-play.show{display:block}
.buffering{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#FFD166;font-size:12px;background:rgba(0,0,0,.65);padding:8px 16px;border-radius:16px;display:none;z-index:2}
.buffering.show{display:block}
.player-ctrl{flex:0 0 auto;background:#0B0D14;padding:10px 22px 6px;border-top:1px solid #1B2030}
.seek-row{display:flex;align-items:center;gap:12px}
.timetext{font-size:11px;color:#A8AEBC;font-variant-numeric:tabular-nums;white-space:nowrap;min-width:96px;text-align:right}
.ctrl-row{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.cbtn{font-size:12px;color:#E6E9F2;background:#22283A;border:1px solid #2E3448;padding:6px 11px;border-radius:8px;min-width:40px;transition:.15s;white-space:nowrap}
.cbtn:hover{background:#333B54;border-color:#4A5472}
.cbtn.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
.cbtn.play{background:var(--brand);border-color:var(--brand);font-weight:700}
.cbtn.play:hover{background:var(--brand2)}
.volbox{display:flex;align-items:center;gap:7px;font-size:11px;color:#A8AEBC}
.spacer{flex:1 1 auto}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;height:18px;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:#333A50}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:13px;height:13px;border-radius:50%;background:var(--brand);margin-top:-4.5px;box-shadow:0 0 0 3px rgba(255,77,94,.18)}
input[type=range]:focus-visible{outline-offset:4px}
#seek{flex:1 1 auto;min-width:80px}
#vol{width:82px}
.player-extra{flex:0 0 auto;max-height:118px;overflow-y:auto;background:#0B0D14;padding:6px 22px 16px}
/* 播放页右栏推荐（窄屏隐藏，≥1024px 双栏布局时显示） */
.player-aside{display:none}
.aside-head{font-size:13px;font-weight:800;margin:4px 0 10px}
.aside-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.aside-item{cursor:pointer;border-radius:10px;overflow:hidden;background:var(--card2);border:1px solid var(--line);transition:transform .15s,border-color .15s}
.aside-item:hover{transform:translateY(-2px);border-color:var(--brand)}
.aside-item:active{transform:scale(.97)}
.aside-poster{aspect-ratio:2/3;display:flex;align-items:flex-end;padding:8px;font-size:11px;font-weight:800;color:#fff;line-height:1.35;text-shadow:0 1px 6px rgba(0,0,0,.55)}
.aside-meta{font-size:10px;color:var(--muted);padding:5px 7px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srcbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.src-label{font-size:11px;color:#FFD166;background:rgba(255,209,102,.14);padding:4px 10px;border-radius:12px}
.src-btn{font-size:11px;color:#C9CEDC;background:rgba(255,255,255,.12);padding:4px 11px;border-radius:12px}
.src-btn.on{background:var(--brand);color:#fff;font-weight:700}
.src-btn.failed{text-decoration:line-through;opacity:.5}
.player-info{font-size:11px;color:#A8AEBC;line-height:1.7;margin-top:8px;max-width:900px}
.player-msg{font-size:12px;color:#FFD166;margin-top:6px;min-height:16px}

/* ---------------- 电视直播 ---------------- */
.live-hero{
  position:relative;border-radius:16px;overflow:hidden;padding:24px 28px;margin-bottom:20px;
  background:linear-gradient(110deg,#3B1D2A 0%,#241A32 55%,#0C0E16 100%);
  border:1px solid var(--line);display:flex;align-items:center;gap:24px;flex-wrap:wrap;
}
.live-hero::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 82% 24%,rgba(224,49,49,.35),transparent 46%);pointer-events:none}
.live-hero-in{position:relative;z-index:1;flex:1 1 300px}
.live-hero .lh-tag{font-size:11px;color:#FF8A8A;font-weight:800;letter-spacing:2px}
.live-hero h1{font-size:28px;margin:8px 0 7px}
.live-hero p{font-size:12px;color:#C9CEDC;line-height:1.8;max-width:620px}
.live-clock{flex:0 0 auto;text-align:right;position:relative;z-index:1}
.live-clock .t{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:2px}
.live-clock .d{font-size:11px;color:var(--muted);margin-top:3px}
.live-stats{display:flex;gap:18px;margin-top:14px;flex-wrap:wrap}
.live-stats span{font-size:11px;color:#C9CEDC}
.live-stats b{color:#FF8A8A;font-size:15px;margin-right:4px}
.live-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:13px}
.ch-card{
  background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;
  transition:transform .18s,border-color .18s;animation:fadeUp .34s both;
  /* 性能：跳过视口外频道的布局与绘制，155 频道全量渲染实测 ~34ms → ~8ms；旧内核自动降级无副作用 */
  content-visibility:auto;contain-intrinsic-size:auto 132px;
}
.ch-card:hover{transform:translateY(-3px);border-color:#4A5472}
.ch-card:focus-visible{outline-offset:3px}
.ch-card.on{border-color:var(--brand);box-shadow:0 0 0 2px rgba(255,77,94,.18)}
.ch-top{display:flex;align-items:center;gap:11px}
.ch-logo{
  width:44px;height:44px;border-radius:11px;flex:0 0 auto;display:flex;align-items:center;
  justify-content:center;font-size:18px;font-weight:800;color:#fff;letter-spacing:1px;
}
.ch-meta{flex:1;min-width:0}
.ch-name{font-size:14px;font-weight:800;display:flex;align-items:center;gap:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live-dot{font-size:9px;font-weight:800;letter-spacing:1px;color:#fff;background:#E03131;padding:2px 6px;border-radius:4px;flex:0 0 auto}
.live-dot::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:#fff;margin-right:4px;vertical-align:1px;animation:livePulse 1.3s infinite}
@keyframes livePulse{0%,100%{opacity:1}50%{opacity:.25}}
.ch-sub{font-size:10px;color:var(--muted);margin-top:4px}
.ch-fav{font-size:17px;color:#6C7288;padding:4px;flex:0 0 auto}
.ch-fav:hover,.ch-fav.on{color:#FFD166}
.ch-epg{margin-top:12px;padding-top:11px;border-top:1px dashed var(--line);font-size:11px;line-height:1.9}
.epg-now{color:#E6E9F2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.epg-now b{color:#FFD166;font-weight:700}
.epg-track{height:3px;background:#2E3448;border-radius:3px;margin:7px 0 6px;overflow:hidden}
.epg-track i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),#FF9A66);border-radius:3px}
.epg-next{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-tools{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 18px;align-items:center}
.ch-tools .lb{font-size:11px;color:var(--muted)}

/* 运行期自诊断：真机无控制台，异常直接显示在页面顶部（不影响正常播放） */
(function(){
  try{ console.log('KAIHONG HTML 1.1.4 (diag)'); }catch(e){}
  var shown = [];
  function show(tag, msg){
    try{
      var d = document.getElementById('__diag');
      if(!d) return;
      var line = '[' + tag + '] ' + msg;
      /* 1.7.0 自动收集：主脚本尚未加载时先缓存，加载后直接进问题中心 */
      try{
        if(typeof window.__khIssue === 'function') window.__khIssue(tag, String(msg), {early:true});
        else (window.__KH_EARLY_ISSUES = window.__KH_EARLY_ISSUES || []).push(
          {tag:tag, msg:String(msg), ts:Date.now()});
      }catch(e){}
      if(shown.indexOf(line) >= 0) return;
      if(shown.length > 6) return;
      shown.push(line);
      d.style.display = 'block';
      d.textContent = shown.join('\n') + '\nUA: ' + navigator.userAgent;
    }catch(e){}
  }
  window.__diag = show;
  window.addEventListener('error', function(e){
    var t = e.target || {};
    if(t && t.tagName === 'SCRIPT'){ show('资源', '脚本加载失败 ' + (t.src || '')); return; }
    if(t && (t.tagName === 'LINK' || t.tagName === 'IMG')){ return; }
    if(t && (t.tagName === 'VIDEO' || t.tagName === 'AUDIO' || t.tagName === 'SOURCE')){
      show('播放', '媒体资源加载失败 ' + (t.src || t.currentSrc || ''));
      return;
    }
    show('脚本', (e.message || '未知错误') + ' 行' + (e.lineno || 0) + ':' + (e.colno || 0));
  }, true);
  window.addEventListener('unhandledrejection', function(e){
    var r = e.reason || {};
    show('异步', (r && r.message) ? r.message : String(r));
  });
  setTimeout(function(){
    var m = document.getElementById('main');
    if(!m || m.children.length === 0){
      show('渲染', '2.5 秒内未渲染出内容（脚本可能未执行）');
    }
  }, 2500);
})();
</script>

  '网页':'error','自检':'info','网络':'warn'};
function issueCfg(){
  var c = getStore(ISSUE_CFG_KEY, null);
  if(!c || typeof c !== 'object') c = {auto:true, createdAt:Date.now()};
  return {auto: c.auto !== false, createdAt: c.createdAt || 0};
}
function saveIssueCfg(c){ setStore(ISSUE_CFG_KEY, c); }
function issueList(){ var v = getStore(ISSUE_KEY, []); return Array.isArray(v) ? v : []; }
function issueSev(kind){ return ISSUE_KINDS[kind] || 'warn'; }
function issueDevice(){
  var d = window.KH_DEVICE;
  if(!d) return '浏览器预览';
  return (d.marketName || d.deviceType || '未知设备') + ' / ' + (d.osFullName || '开鸿') +
         ' API' + (d.apiVersion || '?') + ' / ' + (d.tier || 'mid') + '档 / v' + (d.appVersion || '?');
}
function issuePush(kind, msg, extra){
  try{
    if(!issueCfg().auto) return;
    var text = String(msg === undefined ? '' : msg).replace(/\s+/g, ' ').slice(0, 240);
    if(!text) return;
    var key = kind + '|' + text.slice(0, 120);
    var now = Date.now(), list = issueList(), hit = null;
    for(var i=0;i<list.length && i<40;i++){
      if(list[i].key === key && now - (list[i].ts || 0) < ISSUE_MERGE_MS){ hit = list[i]; break; }
    }
    if(hit){
      hit.n = (hit.n || 1) + 1; hit.ts = now;
      if(extra && extra.url) hit.url = String(extra.url).slice(0, 300);
    } else {
      var row = {key:key, ts:now, kind:kind, msg:text, n:1, sev:issueSev(kind),
                 view:(typeof state !== 'undefined' && state) ? state.view : 'boot',
                 dev:issueDevice()};
      if(extra && extra.code !== undefined) row.code = String(extra.code).slice(0, 20);
      if(extra && extra.url) row.url = String(extra.url).slice(0, 300);
      list.unshift(row);
      if(list.length > ISSUE_MAX) list.length = ISSUE_MAX;
    }
    setStore(ISSUE_KEY, list);
    if(issueSev(kind) === 'error') issueRemoteMaybe();
    /* 正在问题页时不打断操作，延后重绘 */
    if(typeof state !== 'undefined' && state && state.view === 'issues' && typeof render === 'function'){
      clearTimeout(state.issuePaintTimer);
      state.issuePaintTimer = setTimeout(render, 800);
    }
  }catch(e){}
}
window.__khIssue = issuePush;
/* 原生网页页（ArkWeb）加载失败写进 AppStorage 队列，返回影站后由桥接拉回 */
window.__khPushNativeIssues = function(txt){
  try{
    var arr = JSON.parse(txt);
    if(!Array.isArray(arr)) return;
    for(var i=0;i<arr.length && i<40;i++){
      var f = String(arr[i] || '').split('\u0002');
      issuePush(f[0] || '网页', (f[1] ? '[' + f[1] + '] ' : '') + (f[2] || '网页加载失败'),
                {code:f[1] || '', url:f[3] || ''});
    }
  }catch(e){}
};
function pullNativeIssues(){
  try{
    if(window.KaihongBridge && typeof window.KaihongBridge.pullIssues === 'function'){
      window.KaihongBridge.pullIssues();
    }
  }catch(e){}
}
function issueStats(){
  var list = issueList(), now = Date.now(), day = 0, byKind = {}, byMsg = {};
  for(var i=0;i<list.length;i++){
    var it = list[i];
    if(now - (it.ts||0) < 86400000) day += (it.n || 1);
    byKind[it.kind] = (byKind[it.kind] || 0) + (it.n || 1);
    byMsg[it.key] = (byMsg[it.key] || 0) + (it.n || 1);
  }
  var top = [];
  for(var k in byMsg){ if(Object.prototype.hasOwnProperty.call(byMsg,k)) top.push({key:k, n:byMsg[k]}); }
  top.sort(function(a,b){ return b.n - a.n; });
  return {total:list.length, day:day, kinds:byKind, top:top.slice(0,8)};
}
function issueTotalCount(){
  var l = issueList(), n = 0;
  for(var i=0;i<l.length;i++) n += (l[i].n || 1);
  return n;
}
/* 自动体检：启动后 3.5 秒一次，之后每 10 分钟随源清单刷新复检 */
function runIssueSelfCheck(manual){
  try{
    var st = srcHealthStat(), m = srcMeta();
    var line = '资源 ' + allMovies().length + ' 部 / 直播 ' + LIVE_CHANNELS.length +
      ' 频道 / 源清单 v' + (m.v || 0) + ' / 平台 ' + BUILTIN_SITES.length +
      ' / 可用线路 ' + st.good + ' 降权 ' + st.bad + ' / 已记录问题 ' + issueTotalCount() + ' 次';
    issuePush('自检', (manual ? '手动体检：' : '自动体检：') + line);
    if(st.bad >= 5) issuePush('自检', '降权线路较多（' + st.bad + ' 条），建议检查网络或刷新源清单');
    var rel = window.KH_RELEASE && window.KH_RELEASE.latest, dev = window.KH_DEVICE;
    if(rel && dev && Number(dev.apiVersion) > 0 && Number(dev.apiVersion) < Number(rel.minApi)){
      issuePush('兼容', '系统 API' + dev.apiVersion + ' 低于最低要求 API' + rel.minApi);
    }
    if(manual && typeof toast === 'function') toast('体检完成：' + line);
  }catch(e){}
  pullNativeIssues();
  issueRemoteSend(false);
  if(manual && typeof render === 'function') render();
}
function issueReport(){
  var s2 = issueStats(), st = srcHealthStat(), m = srcMeta(), lines = [];
  lines.push('鸿汇影 · 问题诊断报告');
  lines.push('生成时间：' + new Date().toLocaleString('zh-CN', {hour12:false}));
  lines.push('设备：' + issueDevice());
  lines.push('应用：v' + ((window.KH_DEVICE && window.KH_DEVICE.appVersion) || '?') +
             ' / 源清单 v' + (m.v || 0) + ' / 云端 ' +
             ((window.KH_RELEASE && window.KH_RELEASE.latest && window.KH_RELEASE.latest.versionName) || '未知'));
  lines.push('规模：' + allMovies().length + ' 部资源 / ' + LIVE_CHANNELS.length + ' 频道 / ' +
             BUILTIN_SITES.length + ' 平台 / 可用线路 ' + st.good + ' 降权 ' + st.bad);
  lines.push('问题：共 ' + issueTotalCount() + ' 次 / 近 24 小时 ' + s2.day + ' 次 / 去重 ' + s2.total + ' 条');
  lines.push('---- 高频问题 ----');
  for(var i=0;i<s2.top.length;i++){
    var kp = s2.top[i].key.split('|');
    lines.push((i+1) + '. [' + kp[0] + '] ×' + s2.top[i].n + ' ' + kp.slice(1).join('|'));
  }
  if(!s2.top.length) lines.push('（暂无记录）');
  lines.push('---- 最近明细（最多 30 条）----');
  var list = issueList();
  for(var j=0;j<list.length && j<30;j++){
    var it = list[j];
    lines.push(new Date(it.ts).toLocaleString('zh-CN', {hour12:false}) + ' [' + it.kind + ']' +
      (it.code ? '(' + it.code + ')' : '') + ' ×' + (it.n||1) + ' ' + it.msg +
      (it.url ? ' @ ' + it.url : ''));
  }
  lines.push('说明：数据仅存本机，不含账号与片源内容。');
  return lines.join('\n');
}
function copyIssueText(txt, label){
  var ok = false;
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt); ok = true; }
  }catch(e){}
  if(!ok){
    try{
      var ta = document.createElement('textarea');
      ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      ok = document.execCommand('copy');
      document.body.removeChild(ta);
    }catch(e2){}
  }
  toast(ok ? (label || '报告') + '已复制，可粘贴反馈' : '复制失败，请长按下方文本框手动复制');
  return ok;
}

/* ---------------- 远程收集 · 问题自动上报（1.7.0） ----------------
   默认端点由发版流水线写入 ISSUE_REMOTE_DEFAULT；用户可在问题中心改成自己的接口。
   只上报脱敏摘要 + 匿名设备 ID，本地完整记录始终保留，可随时暂停。 */
var ISSUE_REMOTE_KEY = 'kh_issue_remote_v1';
var ISSUE_REMOTE_DEFAULT = '/api/report';
window.KH_DESKTOP = true;
var ISSUE_REMOTE_LAST_TRY = 0;
function issueRemoteCfg(){
  var c = getStore(ISSUE_REMOTE_KEY, null);
  if(!c || typeof c !== 'object') c = {};
  return {
    enabled: (window.KH_DESKTOP ? true : (c.enabled === true)),   // 默认关闭：未明确开启时绝不外发
    url: (typeof c.url === 'string' && /^https?:\/\//i.test(c.url)) ? c.url : ISSUE_REMOTE_DEFAULT,
    lastAt: c.lastAt || 0, sent: c.sent || 0, fails: c.fails || 0,
    err: typeof c.err === 'string' ? c.err : ''
  };
}
function issueDeviceId(){
  var v = getStore('kh_issue_devid', '');
  if(!v || typeof v !== 'string'){
    v = 'kh-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
    setStore('kh_issue_devid', v);
  }
  return v;
}
/* 消息里的完整 URL 只保留域名，避免把片源直链 / 带 token 的地址发到远端 */
function issueSanitize(t){
  return String(t || '').replace(/https?:\/\/[^\s'"<>]+/gi, function(m){
    try{ return new URL(m).hostname; }catch(e){ return '[url]'; }
  }).slice(0, 240);
}
function issueRemoteIncrement(){
  var c = issueRemoteCfg(), list = issueList(), out = [];
  for(var i=0;i<list.length && i<80;i++){
    var it = list[i];
    if((it.ts || 0) < c.lastAt) continue;
    out.push({kind:it.kind, sev:it.sev, code:it.code || '', msg:issueSanitize(it.msg),
              n:it.n || 1, ts:it.ts, view:it.view || '',
              host:it.url ? hostOf(it.url) : ''});
  }
  return out;
}
function issueRemoteDone(at, n, via){
  var c = issueRemoteCfg();
  c.lastAt = at; c.sent = (c.sent || 0) + n; c.fails = 0; c.err = '';
  setStore(ISSUE_REMOTE_KEY, c);
  window.KH_REMOTE_STATE = {ok:true, at:at, n:n, via:via || 'web'};
  if(typeof state !== 'undefined' && state && state.view === 'issues' && typeof render === 'function') render();
}
function issueRemoteFail(msg){
  var c = issueRemoteCfg();
  c.fails = (c.fails || 0) + 1; c.err = String(msg).slice(0, 120);
  setStore(ISSUE_REMOTE_KEY, c);
  if(typeof state !== 'undefined' && state && state.view === 'issues' && typeof render === 'function') render();
}
window.__khRemoteState = function(txt){
  try{
    var r = (typeof txt === 'string') ? JSON.parse(txt) : txt;
    if(r && r.ok) issueRemoteDone(r.at || Date.now(),
      Number(window.KH_REMOTE_PENDING_N || r.n || 0), 'native');
    else issueRemoteFail((r && r.error) || '原生上报失败');
  }catch(e){ issueRemoteFail('上报状态解析失败'); }
};
function issueRemoteSend(manual){
  var c = issueRemoteCfg();
  if(!c.enabled){ if(manual) toast('远程收集已暂停'); return; }
  if(!c.url){ if(manual) toast('请先填写远程收集地址'); return; }
  var inc = issueRemoteIncrement();
  if(!inc.length && !manual) return;
  var st = srcHealthStat(), m = srcMeta(), at = Date.now();
  var body = JSON.stringify({
    schema:1, app:'HongHubMovie', deviceId:issueDeviceId(),
    version:(window.KH_DEVICE && window.KH_DEVICE.appVersion) || '?',
    device:issueDevice(), sentAt:at,
    summary:{total:issueTotalCount(), day:issueStats().day,
             channels:LIVE_CHANNELS.length, platforms:BUILTIN_SITES.length,
             manifest:m.v || 0, good:st.good, bad:st.bad},
    issues:inc
  });
  window.KH_REMOTE_PENDING_N = inc.length;
  if(manual) toast('正在上报 ' + inc.length + ' 条问题摘要…');
  /* 真机走原生 HTTP，避免 file:// 页面的 CORS / 混合内容限制 */
  if(window.KaihongBridge && typeof window.KaihongBridge.reportIssues === 'function'){
    try{ window.KaihongBridge.reportIssues(c.url, body); return; }
    catch(e){ issueRemoteFail('原生通道不可用，改用网页通道'); }
  }
  try{
    fetch(c.url, {method:'POST', cache:'no-store',
      headers:{'Content-Type':'application/json'}, body:body})
      .then(function(r){
        if(!r.ok) throw new Error('HTTP ' + r.status);
        issueRemoteDone(at, inc.length, 'web');
      })
      .catch(function(e){ issueRemoteFail(e && e.message ? e.message : '网络不可达'); });
  }catch(e){ issueRemoteFail(e && e.message ? e.message : '请求发起失败'); }
}
function issueRemoteMaybe(){
  var c = issueRemoteCfg(), now = Date.now();
  if(!c.enabled || !c.url) return;
  if(now - ISSUE_REMOTE_LAST_TRY < 60000) return;
  ISSUE_REMOTE_LAST_TRY = now;
  setTimeout(function(){ issueRemoteSend(false); }, 1500);
}

/* ---------------- 平台入口实时巡检 ---------------- */
/* no-cors 探测只能判断网络层可达（DNS / 连接 / 服务器响应），
   不能读取状态码（浏览器跨域限制）；结果仅作入口健康参考。 */
var PLAT_HEALTH = {};
var PLAT_PROBE_AT = 0;
function probePlatforms(force){
  var now = Date.now();
  if(!force && now - PLAT_PROBE_AT < 300000) return;   // 结果缓存 5 分钟
  PLAT_PROBE_AT = now;
  var pending = BUILTIN_SITES.length;
  function done(){ pending--; if(pending <= 0 && state.view === 'sites') render(); }
  for(var i=0;i<BUILTIN_SITES.length;i++){
    (function(s){
      var key = s.name;
      PLAT_HEALTH[key] = 'ping';
      var ctl = ('AbortController' in window) ? new AbortController() : null;
      var timer = setTimeout(function(){ if(ctl) ctl.abort(); }, 9000);
      fetch(platOpenUrl(s), {mode:'no-cors', cache:'no-store', signal: ctl ? ctl.signal : undefined})
        .then(function(){ clearTimeout(timer); PLAT_HEALTH[key] = 'ok'; done(); })
        .catch(function(){
          clearTimeout(timer); PLAT_HEALTH[key] = 'down';
          issuePush('平台', '入口探测不可达：' + key, {url:platOpenUrl(s)});
          done();
        });
    })(BUILTIN_SITES[i]);
  }
}
function platHealthDot(name){
  var v = PLAT_HEALTH[name];
  if(v === 'ok') return '<span class="pdot ok" title="实时巡检：网络可达"></span>';
  if(v === 'down') return '<span class="pdot down" title="实时巡检：探测不可达，入口仍可尝试打开"></span>';
  if(v === 'ping') return '<span class="pdot ping" title="巡检中…"></span>';
  return '';
}
function platHealthSummary(){
  var ok = 0, down = 0;
  for(var i=0;i<BUILTIN_SITES.length;i++){
    var v = PLAT_HEALTH[BUILTIN_SITES[i].name];
    if(v === 'ok') ok++; else if(v === 'down') down++;
  }
  if(!ok && !down) return '尚未巡检';
  return '实时巡检：' + ok + ' 可达' + (down ? ' / ' + down + ' 不可达' : '');
}

/* ---------------- 远程配置 · 实时同步 ---------------- */
/* 用户可配置自己的 JSON 数据源，应用拉取最新的网站 / 影视资源（直链片源）/
   直播频道清单并幂等合并进本地；开启自动同步后每 10 分钟刷新。
   接口需允许跨域（CORS）。应用不抓取、不缓存第三方版权内容。 */
function getRemoteCfg(){
  var v = getStore('kh_remote', null);
  if(!v || typeof v !== 'object') v = {};
  return {
    url: typeof v.url === 'string' ? v.url : '',
    auto: !!v.auto, last: v.last || 0, lastOk: v.lastOk || 0,
    added: v.added || 0, err: typeof v.err === 'string' ? v.err : ''
  };
}
function saveRemoteCfg(c){ setStore('kh_remote', c); }
function remoteStatusLine(c){
  if(c.err) return '<span class="syncstat err">最近同步失败：' + esc(String(c.err).slice(0, 60)) + '</span>';
  if(c.lastOk) return '<span class="syncstat ok">最近同步 ' + new Date(c.lastOk).toLocaleTimeString('zh-CN', {hour12:false}) + ' · 累计新增 ' + (c.added || 0) + ' 条</span>';
  return '<span class="syncstat">尚未同步</span>';
}
function remoteFetchAndApply(url, silent){
  var c = getRemoteCfg();
  c.url = url; c.err = '';
  var ctl = ('AbortController' in window) ? new AbortController() : null;
  var timer = setTimeout(function(){ if(ctl) ctl.abort(); }, 15000);
  fetch(url, {cache:'no-store', signal: ctl ? ctl.signal : undefined})
    .then(function(r){
      clearTimeout(timer);
      if(!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function(data){ clearTimeout(timer); applyRemoteData(data, c, silent); })
    .catch(function(e){
      clearTimeout(timer);
      c.last = Date.now();
      c.err = '同步失败：' + (e && e.message ? e.message : '网络或 CORS 限制');
      saveRemoteCfg(c);
      if(!silent) toast(c.err);
      if(state.view === 'sites') render();
    });
}
function syncRemoteNow(){
  var input = document.getElementById('remoteUrl');
  var url = input ? input.value.trim() : getRemoteCfg().url;
  if(url && !/^https?:\/\//i.test(url)) url = 'https://' + url.replace(/^\/+/, '');
  if(!url){ toast('请先填写配置 JSON 的网址'); return; }
  if(input) input.value = url;
  toast('正在拉取远程配置…');
  remoteFetchAndApply(url, false);
}
function applyRemoteData(data, c, silent){
  if(!data || typeof data !== 'object'){ c.err = '配置格式错误：根节点应为 JSON 对象'; saveRemoteCfg(c); toast(c.err); return; }
  var added = 0;
  /* 1. 网站 */
  var sites = Array.isArray(data.sites) ? data.sites : [];
  var slist = getSites();
  for(var i=0;i<sites.length && slist.length < 50;i++){
    var s = sites[i];
    if(!s || typeof s.name !== 'string' || !s.name.trim()) continue;
    var u = normalizeSiteUrl(String(s.url || ''));
    if(!u) continue;
    var dup = false;
    for(var j=0;j<slist.length;j++) if(slist[j].url === u){ dup = true; break; }
    if(!dup) for(var b=0;b<BUILTIN_SITES.length;b++) if(BUILTIN_SITES[b].url === u){ dup = true; break; }
    if(dup) continue;
    slist.push({name:String(s.name).trim().slice(0,20), url:u, color:'#3B456B', tag:String(s.name).trim().slice(0,1)});
    added++;
  }
  setStore('kh_sites', slist.slice(0,50));
  /* 2. 影视资源（直链片源） */
  var res = Array.isArray(data.resources) ? data.resources : [];
  var rlist = getRes();
  for(var k=0;k<res.length && rlist.length < 50;k++){
    var r = res[k];
    if(!r || typeof r.title !== 'string' || !r.title.trim()) continue;
    var urls = [];
    var raw = (r.urls && Array.isArray(r.urls)) ? r.urls : (r.url ? [r.url] : []);
    for(var m=0;m<raw.length && m<3;m++){
      var ru = normalizeResUrl(raw[m]);
      if(ru && urls.indexOf(ru) < 0) urls.push(ru);
    }
    if(!urls.length) continue;
    var item = makeRes(r.title, (typeof r.subtitle === 'string' && r.subtitle) ? r.subtitle : '远程同步资源', r.category, urls);
    item.desc = '远程配置实时同步的片源，共 ' + urls.length + ' 路，可自动切换；来源 ' + hostOf(c.url);
    var at = -1;
    for(var q=0;q<rlist.length;q++) if(rlist[q].id === item.id){ at = q; break; }
    if(at >= 0) rlist[at] = item;   // 幂等：同片名+主源覆盖更新
    else { rlist.unshift(item); added++; }
  }
  setStore('kh_vod_res', rlist.slice(0,50));
  /* 3. 直播频道 */
  var chs = Array.isArray(data.channels) ? data.channels : [];
  var clist = getLive();
  for(var n=0;n<chs.length && clist.length < 50;n++){
    var ch = chs[n];
    if(!ch || typeof ch.name !== 'string' || !ch.name.trim()) continue;
    var cu = normalizeStreamUrl(String(ch.url || ''));
    if(!cu) continue;
    var dupc = false;
    for(var w=0;w<clist.length;w++) if(clist[w].url === cu){ dupc = true; break; }
    if(dupc) continue;
    clist.unshift({name:String(ch.name).trim().slice(0,20), url:cu,
      group:(typeof ch.group === 'string' && ch.group.trim()) ? ch.group.trim().slice(0,12) : '远程同步'});
    added++;
  }
  setStore('kh_live', clist.slice(0,50));
  c.last = Date.now(); c.lastOk = c.last; c.added = (c.added || 0) + added; c.err = '';
  saveRemoteCfg(c);
  if(!silent) toast('远程同步完成：本次新增 ' + added + ' 条（网站 / 资源 / 频道）');
  render();
}
/* 自动同步心跳：每分钟检查一次，距上次同步 ≥10 分钟且开关开启时静默拉取 */
setInterval(function(){
  var c = getRemoteCfg();
  if(!c.auto || !c.url) return;
  if(Date.now() - (c.last || 0) < 600000) return;
  remoteFetchAndApply(c.url, true);
}, 60000);

var CATEGORIES = ['全部','电影','动画','短剧','剧集','纪录片','综艺'];
var SECTIONS = [];

/* ---------------- 直播源自动检测 · 自动优化 · 云端自动更新 ----------------
   1) 每次播放都是一次真机体检：失败自动降权、成功自动提权（kh_src_health_v1）；
   2) 起播按健康分排序，已知坏源排到最后，不再从死链开始（rankSources）；
   3) 源清单可由云端下发覆盖内置 LIVE_CHANNELS，启动 + 每 10 分钟自动刷新，
      修源后无需重装 HAP；离线时回落到上次成功覆盖 + 随包基线。            */
var SRC_HEALTH_KEY = 'kh_src_health_v1';
var SRC_OVERRIDE_KEY = 'kh_src_override_v1';
var SRC_META_KEY = 'kh_src_meta_v1';

function srcHealth(){
  var h = getStore(SRC_HEALTH_KEY, {});
  return (h && typeof h === 'object') ? h : {};
}
function markSrc(url, ok){
  if(!url || typeof url !== 'string') return;
  var h = srcHealth();
  var r = h[url] || {ok:0, fail:0};
  var now = Date.now();
  if(ok){
    r.ok = Math.min(999, (r.ok || 0) + 1); r.fail = 0; r.ban = 0; r.last = now;
  } else {
    r.fail = Math.min(999, (r.fail || 0) + 1);
    issuePush('源', '片源加载失败（连续 ' + r.fail + ' 次）：' + String(url).slice(0, 90), {url:url});
    if(r.fail >= 2) r.ban = now;          // 连败 2 次进入 30 分钟降权冷却
    r.last = now;
  }
  h[url] = r;
  var keys = Object.keys(h);
  if(keys.length > 400){
    keys.sort(function(a,b){ return (h[a].last || 0) - (h[b].last || 0); });
    for(var i=0;i<keys.length-300;i++) delete h[keys[i]];
  }
  setStore(SRC_HEALTH_KEY, h);
}
function srcHealthStat(){
  var h = srcHealth(), good = 0, bad = 0, now = Date.now();
  for(var k in h){
    if(!Object.prototype.hasOwnProperty.call(h,k)) continue;
    if(h[k].ban && (now - h[k].ban) < 1800000) bad++;
    else if(h[k].ok > 0) good++;
  }
  return {good:good, bad:bad};
}
function rankSources(ch){
  var srcs = (ch && ch.sources) ? ch.sources.slice() : [];
  if(srcs.length < 2) return srcs;
  var h = srcHealth(), now = Date.now(), arr = [];
  for(var i=0;i<srcs.length;i++){
    var r = h[srcs[i].url] || {};
    var banned = r.ban && (now - r.ban) < 1800000;
    var sc = banned ? -1000 : (r.ok || 0) * 10 - (r.fail || 0) * 3;
    arr.push({s:srcs[i], i:i, sc:sc});
  }
  arr.sort(function(a,b){ return (b.sc - a.sc) || (a.i - b.i); });
  var out = [];
  for(var j=0;j<arr.length;j++) out.push(arr[j].s);
  return out;
}
function srcMeta(){
  var m = getStore(SRC_META_KEY, {});
  return (m && typeof m === 'object') ? m : {};
}

  var m = srcMeta(), st = srcHealthStat();
  var v = m.v ? ('v' + m.v) : '随包基线';
  var t = m.appliedAt ? new Date(m.appliedAt).toLocaleTimeString('zh-CN', {hour12:false}) : '尚未联网更新';

/* 云端清单可同时下发内置平台、检索模板与红果直达地址；本地持久化，重启后仍生效。
   校验字段与 URL 协议，避免坏数据把页面打崩。 */
function applySiteData(data, from){
  if(!data || !Array.isArray(data.sites) || !data.sites.length) return 0;
  var out = [];
  for(var i=0;i<data.sites.length && i<80;i++){
    var x = data.sites[i];
    if(!x || typeof x.name !== 'string' || typeof x.url !== 'string') continue;
    if(!/^https?:\/\//i.test(x.url)) continue;
    var row = {
      name: x.name.slice(0,24), url: x.url.slice(0,512),
      color: (typeof x.color === 'string' && /^#[0-9a-fA-F]{6}$/.test(x.color)) ? x.color : '#3B456B',
      tag: (typeof x.tag === 'string' && x.tag) ? x.tag.slice(0,2) : x.name.slice(0,1),
      cat: (typeof x.cat === 'string' && x.cat) ? x.cat.slice(0,20) : '综合视频'
    };
    if(typeof x.mobile === 'string' && /^https?:\/\//i.test(x.mobile)) row.mobile = x.mobile.slice(0,512);
    if(typeof x.mode === 'string' && PLAT_MODE[x.mode]) row.mode = x.mode;
    out.push(row);
  }
  if(!out.length) return 0;
  BUILTIN_SITES = out;
  if(data.searchTpl && typeof data.searchTpl === 'object' && !Array.isArray(data.searchTpl)){
    SEARCH_TPL = data.searchTpl;
  }
  if(data.quick && typeof data.quick === 'object' && !Array.isArray(data.quick)){
    window.KH_QUICK = data.quick;
  }
  /* 远程收集端点可随云端清单热更新下发；默认空 + 默认关闭，是否外发始终由用户决定 */
  if(typeof data.remoteUrl === 'string' && /^https?:\/\//i.test(data.remoteUrl)){
    ISSUE_REMOTE_DEFAULT = data.remoteUrl.slice(0, 300);
  }
  setStore(SITES_CLOUD_KEY, {v:Number(data.v||0), sites:out,
    searchTpl:data.searchTpl || null, quick:data.quick || null});
  try{ console.log('[自动更新] 平台清单已应用：' + out.length + ' 个 · 来源 ' + (from || '-')); }catch(e){}
  if(typeof state !== 'undefined' && state && !state.movie) render();
  return out.length;
}
function applySourceData(data, from){
  if(!data || typeof data !== 'object' || !Array.isArray(data.channels)) return 0;
  var v = Number(data.v || 0);
  if(!isFinite(v) || v < 0) return 0;
  var cur = srcMeta();
  if(v && cur.v && v <= cur.v && from !== 'local'){
    try{ console.log('[自动更新] 已是最新源清单 v' + cur.v + '（云端 v' + v + '）'); }catch(e){}
    return -1;   // 幂等：不回退旧版
  }
  var map = {};
  for(var i=0;i<LIVE_CHANNELS.length;i++) map[LIVE_CHANNELS[i].id] = i;
  var hit = 0;
  for(var j=0;j<data.channels.length;j++){
    var c = data.channels[j];
    if(!c || typeof c.id !== 'string' || !Array.isArray(c.sources) || !c.sources.length) continue;
    var at = map[c.id];
    if(at === undefined) continue;
    var ss = [];
    for(var k=0;k<c.sources.length && k<6;k++){
      var so = c.sources[k];
      if(so && typeof so.url === 'string' && /^https?:\/\//i.test(so.url)){
        ss.push({label: (typeof so.label === 'string' && so.label) ? so.label.slice(0,24) : ('线路 ' + (k+1)), url:so.url});
      }
    }
    if(!ss.length) continue;
    LIVE_CHANNELS[at].sources = ss;
    hit++;
  }
  var siteHit = applySiteData(data, from);
  if(!hit && !siteHit) return 0;
  setStore(SRC_META_KEY, {v:v, updatedAt:data.updatedAt || '', appliedAt:Date.now(), from:from || '', count:hit});
  setStore(SRC_OVERRIDE_KEY, {v:v, updatedAt:data.updatedAt || '', channels:data.channels});
  try{ console.log('[自动更新] ' + hit + ' 个频道已应用 ' + (v ? 'v'+v : '基线') + ' · 来源 ' + (from || '-')); }catch(e){}
  if(typeof state !== 'undefined' && state && !state.movie) render();
  return hit;
}

function switchLive(delta){

  if(!n) return;
  var i = (state.liveIndex + delta + n * 2) % n;
  state.liveIndex = i;

  if(!nEl || !uEl) return;

    list[state.liveEdit] = item; toast('已保存修改');

function parseM3u(text){
  var lines = String(text).split(/\r?\n/), out = [], pend = null;
  for(var i=0;i<lines.length;i++){
    var ln = lines[i].trim();
    if(!ln) continue;
    if(/^#EXTINF/i.test(ln)){
      var g = /group-title="([^"]*)"/i.exec(ln);
      var n = /tvg-name="([^"]*)"/i.exec(ln);
      var c = ln.lastIndexOf(',');
      var nm = c >= 0 ? ln.slice(c+1).trim() : '';
      pend = {name:(n && n[1] ? n[1] : nm).slice(0,20), group:(g && g[1] ? g[1] : '我添加的').slice(0,12)};
      continue;
    }
    if(/^https?:\/\//i.test(ln)){
      var u = normalizeStreamUrl(ln);
      if(u){
        out.push({name:(pend && pend.name) || ('频道 ' + (out.length+1)),
                  group:(pend && pend.group) || '我添加的', url:u});
      }
      pend = null;
    }
  }
  return out;
}

  if(!incoming.length){ toast('没有解析到有效频道（需 #EXTINF + http(s) 地址）'); return; }
  var list = getLive(), added = 0, seen = {};
  for(var i=0;i<list.length;i++) seen[list[i].url] = true;
  for(var j=0;j<incoming.length && list.length < 50;j++){

    if(seen[s.url]) continue;
    seen[s.url] = true;

}

/* ---------------- 本地存储：带类型守卫，损坏数据自动自愈 ---------------- */
var mem = {};
var BOOT_AT = Date.now();
function getStore(k, d){
  var raw;
  try{ raw = localStorage.getItem(k); }
  catch(e){ return mem[k] === undefined ? d : mem[k]; }  // localStorage 不可用：降级内存
  if(raw === null) return d;
  try{ return JSON.parse(raw); }
  catch(e){
    // 数据损坏：删除坏键并写回默认值，真正自愈而不是每次都走异常分支
    try{ localStorage.removeItem(k); }catch(e2){}
    mem[k] = d;
    return d;
  }
}
function setStore(k, v){
  mem[k] = v;
  try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){}
}
function strArray(k){
  var v = getStore(k, []);
  if(!Array.isArray(v)){ setStore(k, []); return []; }
  var out = [];
  for(var i=0;i<v.length;i++){ if(typeof v[i] === 'string') out.push(v[i]); }
  return out;
}
function plainObject(k){
  var v = getStore(k, {});
  if(!v || typeof v !== 'object' || Array.isArray(v)){ setStore(k, {}); return {}; }
  return v;
}
function getFav(){ return strArray('kh_fav'); }
function getHistory(){ return strArray('kh_hist'); }
function getProgress(){ return plainObject('kh_prog'); }
function getSites(){
  var v = getStore('kh_sites', []);
  if(!Array.isArray(v)){ setStore('kh_sites', []); return []; }
  var out = [];
  for(var i=0;i<v.length;i++){
    var s = v[i];
    if(s && typeof s.name === 'string' && typeof s.url === 'string' && /^https?:\/\//i.test(s.url)) out.push(s);
  }
  return out;
}
function normalizeSiteUrl(raw){
  var u = String(raw || '').trim();
  if(!u) return '';
  if(!/^https?:\/\//i.test(u)) u = 'https://' + u;
  try{
    var p = new URL(u);
    if(p.protocol !== 'http:' && p.protocol !== 'https:') return '';
    if(!p.hostname) return '';
    return p.href;
  }catch(e){ return ''; }
}
function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function reEsc(s){ return String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function highlight(escaped, kw){
  if(!kw) return escaped;
  try{ return escaped.replace(new RegExp('(' + reEsc(esc(kw)) + ')', 'ig'), '<mark>$1</mark>'); }
  catch(e){ return escaped; }
}
function hashId(s){
  var h = 0;
  for(var i=0;i<s.length;i++){ h = ((h << 5) - h + s.charCodeAt(i)) | 0; }
  return (h >>> 0).toString(36);
}

/* ---------------- 影视资源配置：自建片源 CRUD + 备份 ---------------- */
function normalizeResUrl(raw){
  var u = String(raw || '').trim();
  if(!u || !/^https?:\/\//i.test(u)) return '';
  return u;
}
function makeRes(title, sub, cat, urls, id){
  var labels = ['在线主源','在线备源','备用线路'];
  var srcs = [];
  for(var i=0;i<urls.length;i++) srcs.push({label:labels[i] || ('备用线路 ' + (i+1)), url:urls[i]});
  return {
    id:id || ('res_' + hashId(title + '|' + urls[0])),
    title:String(title).slice(0,24), subtitle:String(sub || '自建影视资源').slice(0,40),
    year:new Date().getFullYear(), rating:0,
    category:(cat && RES_CATEGORIES.indexOf(cat) >= 0) ? cat : '电影',
    tags:['自建'], desc:'你在「资源配置」里添加的片源，共 ' + urls.length + ' 路，可自动切换。',
    cast:'自建资源', color:'#2A3550', accent:'#5B7BC4', own:true, sources:srcs
  };
}
function addRes(){
  var t = document.getElementById('resTitle'), sub = document.getElementById('resSub'), cat = document.getElementById('resCat');
  var u1 = document.getElementById('resUrl1'), u2 = document.getElementById('resUrl2'), u3 = document.getElementById('resUrl3');
  var title = t ? t.value.trim() : '';
  if(!title){ toast('请填片名'); return; }
  var urls = [], raw = [u1 && u1.value, u2 && u2.value, u3 && u3.value];
  for(var i=0;i<raw.length;i++){
    var u = normalizeResUrl(raw[i]);
    if(u && urls.indexOf(u) < 0) urls.push(u);
  }
  if(!urls.length){ toast('请填至少 1 路 http(s) 视频直链'); return; }
  var list = getRes();
  var item = makeRes(title, sub && sub.value.trim(), cat && cat.value, urls);
  if(state.resEdit >= 0 && state.resEdit < list.length){
    item.id = list[state.resEdit].id;
    list[state.resEdit] = item;
    toast('已保存修改');
  } else {
    list.unshift(item);
    toast('已添加：' + title);
  }
  setStore('kh_vod_res', list.slice(0,50));
  state.resEdit = -1;
  render();
}
function startEditRes(index){
  var list = getRes();
  if(index < 0 || index >= list.length) return;
  var r = list[index];
  state.resEdit = index;
  render();
  var f = {resTitle:r.title, resSub:r.subtitle, resUrl1:'', resUrl2:'', resUrl3:''};
  for(var i=0;i<r.sources.length;i++) f['resUrl' + (i+1)] = r.sources[i].url;
  for(var k in f){ var el = document.getElementById(k); if(el) el.value = f[k]; }
  var c = document.getElementById('resCat'); if(c) c.value = r.category;
  var t = document.getElementById('resTitle'); if(t) t.focus();
  els.main.scrollTop = 0;
}
function moveUpRes(index){
  var list = getRes();
  if(index <= 0 || index >= list.length) return;
  var t = list[index]; list[index] = list[index-1]; list[index-1] = t;
  setStore('kh_vod_res', list);
  if(state.resEdit === index) state.resEdit = index - 1;
  else if(state.resEdit === index - 1) state.resEdit = index;
  render();
}
function delRes(index){
  var list = getRes();
  if(index < 0 || index >= list.length) return;
  var removed = list.splice(index, 1)[0];
  setStore('kh_vod_res', list);
  state.resEdit = -1;
  toast('已删除：' + removed.title, '撤销', function(){ list.splice(index, 0, removed); setStore('kh_vod_res', list); render(); });
  render();
}
function exportRes(){
  var ta = document.getElementById('resBackup');
  if(!ta) return;
  var text = JSON.stringify(getRes());
  ta.value = text; ta.focus(); ta.select();
  try{ if(navigator.clipboard) navigator.clipboard.writeText(text).catch(function(){}); }catch(e){}
  toast('已导出 ' + getRes().length + ' 个自建资源，可复制备份');
}
function importRes(){
  var ta = document.getElementById('resBackup');
  if(!ta || !ta.value.trim()){ toast('请先粘贴备份 JSON'); return; }
  var incoming;
  try{ incoming = JSON.parse(ta.value.trim()); }catch(e){ toast('备份格式不是合法 JSON'); return; }
  if(!Array.isArray(incoming)){ toast('备份应为资源数组'); return; }
  var list = getRes(), added = 0, seen = {};
  for(var i=0;i<list.length;i++) seen[list[i].id] = true;
  for(var k=0;k<incoming.length && list.length < 50;k++){
    var r = incoming[k];
    if(!r || typeof r.title !== 'string') continue;
    var urls = [], ss = Array.isArray(r.sources) ? r.sources : [];
    for(var j=0;j<ss.length;j++){
      var u = normalizeResUrl(ss[j] && ss[j].url ? ss[j].url : ss[j]);
      if(u && urls.indexOf(u) < 0) urls.push(u);
    }
    if(!urls.length) continue;
    var id = (r.id && typeof r.id === 'string' && /^res_[a-z0-9]+$/.test(r.id))
      ? r.id : ('res_' + hashId(r.title + '|' + urls[0]));
    if(seen[id]) continue;
    seen[id] = true;
    list.push(makeRes(r.title, r.subtitle, r.category, urls, id));
    added++;
  }
  setStore('kh_vod_res', list);
  toast('导入完成，新增 ' + added + ' 个资源');
  render();
}
function clearRes(yes){
  if(!yes){ state.resConfirmClear = true; render(); return; }
  setStore('kh_vod_res', []);
  state.resConfirmClear = false;
  state.resEdit = -1;
  toast('已清空全部自建影视资源');
  render();
}
function resItem(r, index){
  return '<div class="siteitem">' +
    '<div class="siteico" style="background:' + esc(r.color || '#3B456B') + '">' + esc((r.title || 'R').slice(0,1)) + '</div>' +
    '<div class="sitemeta"><div class="n">' + esc(r.title) + '</div>' +
    '<div class="u">' + esc(r.category) + ' · ' + r.sources.length + ' 路源 · ' + esc(String(r.sources[0].url).slice(0,32)) + '</div></div>' +
    '<button class="siteopen" data-act="res-play" data-id="' + esc(r.id) + '">播放</button>' +
    '<button class="mini" data-act="res-sync" data-index="' + index + '" title="同步到各大平台">⇄</button>' +
    '<button class="mini" data-act="res-up" data-index="' + index + '" title="上移">↑</button>' +
    '<button class="mini" data-act="res-edit" data-index="' + index + '" title="编辑">✎</button>' +
    '<button class="sitedel" data-act="res-del" data-index="' + index + '" title="删除">✕</button>' +
  '</div>';
}
function resAction(act, node){
  if(act === 'res-add') addRes();
  else if(act === 'res-cancel'){ state.resEdit = -1; render(); }
  else if(act === 'res-edit') startEditRes(parseInt(node.getAttribute('data-index'), 10));
  else if(act === 'res-up') moveUpRes(parseInt(node.getAttribute('data-index'), 10));
  else if(act === 'res-del') delRes(parseInt(node.getAttribute('data-index'), 10));
  else if(act === 'res-play'){ var m = findMovie(node.getAttribute('data-id')); if(m) openPlayer(m); }
  else if(act === 'res-sync'){
    var rl = getRes();
    var ri0 = parseInt(node.getAttribute('data-index'), 10);
    if(!isNaN(ri0) && ri0 >= 0 && ri0 < rl.length){
      state.syncTitle = String(rl[ri0].title || '').trim().slice(0, 40);
      toast('已把「' + state.syncTitle + '」填入平台同步');
      render();
      var st0 = document.getElementById('syncTitle');
      if(st0) st0.focus();
    }
  }
  else if(act === 'res-fill'){
    var t = document.getElementById('resTitle'), sb = document.getElementById('resSub'), u = document.getElementById('resUrl1');
    if(t) t.value = '我的短剧'; if(sb) sb.value = '自建示例片源';
    if(u) u.value = 'https://你的视频直链.mp4';
    toast('已填入占位示例，替换成你自己的网址即可');
  }
  else if(act === 'res-export') exportRes();
  else if(act === 'res-import') importRes();
  else if(act === 'res-clear') clearRes(false);
  else if(act === 'res-clear-yes') clearRes(true);
  else if(act === 'res-clear-no'){ state.resConfirmClear = false; render(); }
}

function addSite(){
  var nEl = document.getElementById('siteName');

  if(!url){ toast('请填合法的 http(s) 网址'); return; }
  var list = getSites();
  for(var i=0;i<list.length;i++){
    if(i !== state.editIndex && list[i].url === url){ toast('这个网址已经在列表里了'); return; }
  }
  for(var j=0;j<BUILTIN_SITES.length;j++){ if(BUILTIN_SITES[j].url === url){ toast('这个网址已在预置列表里'); return; } }
  var item = {name:name.slice(0,20), url:url, color:'#3B456B', tag:name.slice(0,1)};
  if(state.editIndex >= 0 && state.editIndex < list.length){
    list[state.editIndex] = item;
    toast('已保存修改');
  } else {
    list.unshift(item);
    toast('已添加：' + name);
  }
  setStore('kh_sites', list.slice(0,50));
  state.editIndex = -1;
  render();
}
function delSite(index){

  setStore('kh_sites', list);
  if(state.editIndex === at) state.editIndex = -1;

    var cur = getSites();

    setStore('kh_sites', cur.slice(0,50));
    toast('已恢复「' + removed.name + '」');
    render();
  });
  render();
}
function startEdit(index){

function moveUp(index){

function exportSites(){

    var v = els.video;
    if(v.readyState >= 2 && v.videoWidth > 0) return;   // 已有画面，无需回退
    state.watchdogFired++;
    setDiag('watchdog', state.watchdogFired);
    toast('片源加载超时，已自动切换下一路');
    nextSource();
  }, limit);
}
function nextSource(){
  if(!state.movie) return;
  // 每个片源只允许触发一次回退，避免 video error 与 HLS fatal 双重触发跳级
  var key = state.movie.id + '|' + state.srcIndex;
  if(state.failKey === key) return;
  state.failKey = key;
  state.failedSrc[state.srcIndex] = true;
  var srcs = currentSources(state.movie);
  if(state.movie.live && srcs[state.srcIndex] && srcs[state.srcIndex].url) markSrc(srcs[state.srcIndex].url, false);
  if(state.srcIndex + 1 < srcs.length){
    toast('片源不可用，自动切换 ' + srcs[state.srcIndex+1].label);
    loadSource(state.srcIndex + 1);
  } else {
    els.msg.textContent = '全部片源暂不可用，请检查网络或稍后重试';
    setDiag('state','error');
    setSrcLabel('片源不可用');
    els.buffering.classList.remove('show');
  }
}
function closePlayer(){
  clearWatchdog();
  saveProgress(true);
  destroyHls();
  els.video.pause();
  els.video.removeAttribute('src');
  els.video.load();
  els.player.classList.remove('show');
  els.player.classList.remove('live-mode');
  els.liveBar.classList.remove('show');
  els.tap.classList.remove('show');
  els.buffering.classList.remove('show');
  try{ if(document.fullscreenElement) document.exitFullscreen(); }catch(e){}
  state.movie = null;
  render();
}
function saveProgress(force){
  if(!state.movie || state.movie.custom || state.movie.live) return;
  var t = els.video.currentTime;
  if(!isFinite(t) || t <= 0) return;
  var now = Date.now();
  if(!force && now - state.lastSave < 4000) return;
  state.lastSave = now;
  var p = getProgress();
  p[state.movie.id] = Math.floor(t);
  setStore('kh_prog', p);
}
function seekBy(delta){
  var v = els.video;
  if(!isFinite(v.duration) || v.duration <= 0) return;
  v.currentTime = Math.max(0, Math.min(v.duration - 0.2, v.currentTime + delta));
  syncSeek();
}
function seekToPct(pct){
  var v = els.video;
  if(!isFinite(v.duration) || v.duration <= 0) return;
  v.currentTime = Math.max(0, Math.min(v.duration - 0.2, v.duration * pct));
  syncSeek();
}
function syncSeek(){
  var v = els.video;
  var d = isFinite(v.duration) ? v.duration : 0;
  if(!state.seekDragging){
    els.seek.value = String(d > 0 ? (v.currentTime / d) * 100 : 0);
  }
  els.timeText.textContent = fmtTime(v.currentTime) + ' / ' + fmtTime(d);
}
function applyVolume(val, fromUser){
  val = Math.max(0, Math.min(1, val));
  if(fromUser){ state.userVolume = val; if(val > 0) state.userMuted = false; }
  els.video.volume = val;
  els.video.muted = state.userMuted;
  els.vol.value = String(val);
  els.btnMute.textContent = state.userMuted || val === 0 ? '🔇' : '🔊';
  els.btnMute.classList.toggle('on', state.userMuted);
  setDiag('volume', val.toFixed(2));
  setDiag('muted', state.userMuted ? 1 : 0);
}
function toggleMute(){
  state.userMuted = !state.userMuted;
  applyVolume(state.userVolume, false);
  toast(state.userMuted ? '已静音' : '已恢复声音');
}
function cycleRate(){
  var i = RATES.indexOf(state.rate);
  state.rate = RATES[(i + 1) % RATES.length];
  els.video.playbackRate = state.rate;
  els.btnRate.textContent = state.rate.toFixed(2).replace(/0$/, '') + '×';
  els.btnRate.classList.toggle('on', state.rate !== 1);
  setDiag('rate', state.rate);
  toast('倍速 ' + state.rate + '×');
}
function toggleFullscreen(){
  var wrap = els.videoWrap;

    else if(els.video.webkitEnterFullscreen){ els.video.webkitEnterFullscreen(); }

}

document.addEventListener('keydown', function(e){
  var inPlayer = els.player.classList.contains('show');
  var tag = e.target && e.target.tagName ? e.target.tagName : '';
  var typing = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
  if(inPlayer){
    if(e.key === 'Escape'){ e.preventDefault(); closePlayer(); return; }
    if(typing) return;
    var k = e.key;
    if(k === ' ' || k === 'k' || k === 'K'){ e.preventDefault(); togglePlay(); }
    else if(k === 'ArrowLeft' || k === 'j' || k === 'J'){ e.preventDefault(); seekBy(-10); }
    else if(k === 'ArrowRight' || k === 'l' || k === 'L'){ e.preventDefault(); seekBy(10); }
    else if(k === 'ArrowUp'){
      e.preventDefault();
      if(state.movie && state.movie.live) switchLive(-1); else applyVolume(state.userVolume + 0.1, true);
    }
    else if(k === 'ArrowDown'){
      e.preventDefault();
      if(state.movie && state.movie.live) switchLive(1); else applyVolume(state.userVolume - 0.1, true);
    }
    else if(k === 'm' || k === 'M'){ e.preventDefault(); toggleMute(); }
    else if(k === 'f' || k === 'F'){ e.preventDefault(); toggleFullscreen(); }
    else if(/^[0-9]$/.test(k)){ e.preventDefault(); seekToPct(parseInt(k, 10) / 10); }
    return;
  }
  if(e.key === 'Escape'){ state.confirmClear = false; return; }
  /* 电脑端：按 / 快速聚焦搜索框（播放器外、未在输入时） */
  if(e.key === '/' && !e.ctrlKey && !e.metaKey && !e.altKey){
    var tg = e.target && e.target.tagName ? e.target.tagName : '';
    if(tg !== 'INPUT' && tg !== 'TEXTAREA' && tg !== 'SELECT'){
      e.preventDefault();
      if(els.search){ els.search.focus(); els.search.select && els.search.select(); }
      return;
    }
  }
  if(e.key === 'Enter' && (e.target.id === 'siteName' || e.target.id === 'siteUrl')){ addSite(); return; }
  if(e.key === 'Enter' && e.target.id === 'remoteUrl'){ syncRemoteNow(); return; }
  if(e.key === 'Enter' && e.target.id === 'syncTitle'){
    var sbtn = document.querySelector('[data-act="sync-go"]');
    if(sbtn) sbtn.click();
    return;
  }
  if(e.key === 'Enter' && (e.target.id === 'liveName' || e.target.id === 'liveUrl' || e.target.id === 'liveGroupInput')){ addLive(); return; }
  if(e.key === 'Enter' && e.target.id === 'urlInput'){
    var btn = document.querySelector('[data-act="url-play"]');
    if(btn) btn.click();
    return;
  }
  var card = e.target.closest ? e.target.closest('.card[data-act="play"]') : null;
  if(card && (e.key === 'Enter' || e.key === ' ')){
    e.preventDefault();
    var m = findMovie(card.getAttribute('data-id'));
    if(m) openPlayer(m);
  }
});

  var tail = expect.split('/').pop().split('?')[0];

/* 可选访问口令：中枢开启 KH_ACCESS_TOKEN 后，所有 /api 请求自动带上口令 */
(function () {
  try {
    var _f = window.fetch ? window.fetch.bind(window) : null;
    if (!_f) return;
    window.fetch = function (u, o) {
      o = o || {};
      var t = ''; try { t = localStorage.getItem('khAccessToken') || ''; } catch (e) {}
      if (t && typeof u === 'string' && u.indexOf('/api/') >= 0) {
        var h = o.headers;
        if (!h || typeof h !== 'object' || typeof h.append !== 'function') {
          o.headers = Object.assign({}, (h && typeof h === 'object') ? h : {}, { 'X-KH-Access-Token': t });
        }
      }
      return _f(u, o);
    };
  } catch (e) {}
})();

/* 自动更新落地：校验安装包 SHA256 → 拉起安装向导（用户仍需在向导里确认） */
function khInstallUpdate() {
  if (!confirm('将校验最新安装包并以「覆盖安装」方式更新：\n· 无需先卸载当前版本，也无需手动删除任何文件；\n· 同目录覆盖安装，你的数据与设置都会保留；\n· 若提示程序被占用，请先退出本应用再继续。\n继续吗？')) return;
  fetch('/api/update/install', { method: 'POST', cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (d && d.ok) {
        try { toast('✅ 安装向导已启动（v' + (d.version || '') + ' · ' + (d.verified === 'sha256' ? 'SHA256 校验通过' : '体积校验通过') + '）'); } catch (e) {}
      } else {
        try { toast('⚠️ 未能启动安装：' + ((d && d.error) || '未知错误')); } catch (e) {}
      }
    })
    .catch(function (e) { try { toast('⚠️ 安装请求失败：' + e); } catch (e2) {} });
}

function khRunFeature(f) {
  try {
    var a = f.action || '';
    if (a === 'open' && f.url) {
      if (f.url.indexOf('http') === 0) window.open(f.url, '_blank'); else location.href = f.url;
      return;
    }
    if (a.indexOf('builtin:') === 0) {
      if (a === 'builtin:report') { copyIssueText(issueReport(), '诊断报告'); return; }
      if (a === 'builtin:sourcespeed') { khFeatureSourceSpeed(); return; }
      if (a === 'builtin:fix') { khFeatureFix(); return; }
      if (a === 'builtin:updatepublish') { khFeatureUpdatePublish(); return; }
      if (a === 'builtin:mine') { khFeatureMine(); return; }
      if (a === 'builtin:batch' || a === 'builtin:arch') { khFeatureBatch(a); return; }
      if (a === 'builtin:playback') { khFeaturePlayback(); return; }
      if (a === 'builtin:memory') { khFeatureMemory(); return; }
      if (a === 'builtin:update') { khFeatureAutoUpdate(); return; }
      if (a === 'builtin:os') { khFeatureOS(); return; }
    if (a === 'builtin:automation') { khFeatureAutomation(); return; }
    if (a === 'builtin:govern') { khFeatureGovern(); return; }
    if (a === 'builtin:updatecheck') { khFeatureUpdateCheck(); return; }
    toast('未识别的内置功能：' + a); return;
    }
    if (a === 'script' || a === 'webhook') {
      if (f.confirm) { try { if (!confirm('确认运行功能「' + (f.name || f.id) + '」？')) return; } catch (e) {} }
      toast('正在运行：' + (f.name || f.id) + ' …');
      fetch('/api/feature/run', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: f.id }) })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (!d || !d.ok) { toast('运行失败：' + String(d && d.error || '').slice(0, 120)); return; }
          if (d.action === 'open') { window.open(d.url, '_blank'); return; }
          if (d.stdout !== undefined) toast('✅ 完成（退出码 ' + (d.code || 0) + '）：\n' + String(d.stdout || '').slice(0, 300));
          else if (d.status !== undefined) toast('✅ 接口返回 ' + d.status + (d.body ? ('：' + String(d.body).slice(0, 200)) : ''));
          else toast('✅ 已运行');
        }).catch(function (e) { toast('请求失败：' + (e && e.message || e)); });
      return;
    }
    toast('未识别的功能动作：' + a);
  } catch (e) { toast('功能执行失败：' + (e && e.message || e)); }
}

function khFeatureSourceSpeed() {

    var chs = window.LIVE_CHANNELS || [], rows = [];

      rows.push({ n: chs[i].name, n_src: (chs[i].sources || []).length, group: chs[i].group || '' });

    rows.sort(function (a, b) { return b.n_src - a.n_src; });

      }).join('\n');

  } catch (e) { toast('排行失败：' + (e && e.message || e)); }
}

/* 自动下发 + 自动更新：启动与定时轮询自动比对版本、拉取最新功能 / 源清单 / 播放档位。
   任意设备 / 任意内存都拿到可用成品；低内存或未知设备自动保底免安装在线版。 */
function khApplyDeliveryPlan(){
  if(!window.fetch) return;
  var p = khPlayerProfile();
  var q = '/api/delivery/plan?arch=' + encodeURIComponent(p.arch) +
    '&mem=' + encodeURIComponent(p.mem) + '&os=' + encodeURIComponent(p.os || '') +
    '&code=' + encodeURIComponent(KH_APP_CODE) +
    (window.KH_HARMONY ? '&platform=harmony' : '&platform=desktop');
  fetch(q, { cache:'no-store' }).then(function(r){ return r.json(); }).then(function(d){
    if(!d || !d.ok) return;
    window.KH_DELIVERY_PLAN = d;
    // 播放档位随下发计划自动更新（下一次起播生效；正在播放的实例立即收紧码率上限）
    if(d.playback && window.KHPlayer && window.KHPlayer.override){
      window.KHPlayer.override(d.playback);
      var h = window.KHPlayer.current();
      if(h){ try{ if(isFinite(d.playback.autoLevelCapping) && d.playback.autoLevelCapping >= 0) h.autoLevelCapping = d.playback.autoLevelCapping; }catch(e){} }
    }
    // 内容永远自动最新：功能清单 / 源清单 / 播放档位，不需要重装
    if(d.update && d.update.autoContentUpdate){
      fetch('/api/features/sync', {cache:'no-store'}).then(function(r){ return r.json(); })
        .then(function(f){ if(f && Array.isArray(f.features)) window.__khLoadFeatures(f.features, f.version); }).catch(function(){});
      fetch('/api/manifest', {cache:'no-store'}).then(function(r){ return r.json(); })
        .then(function(m){ if(m && m.sources) window.__khApplySources(JSON.stringify(m.sources)); }).catch(function(){});
    }
    // 仅完整包 / HAP 通道提示安装更新（安装仍需用户确认）；免安装通道天然永远最新
    if(d.update && d.update.needUpdate && d.channel !== 'lite' && !window.KH_HARMONY) khShowUpdateBanner(d.update.latest);
    try{ khRenderTools(); }catch(e){}
  }).catch(function(){});
}
function khFeatureMemory(){
  var d = window.KH_DELIVERY_PLAN, p = khPlayerProfile(), c = khHlsConfig(p);
  toast('🧠 不限内存 / 不限设备：' + (d ? d.memoryTier : p.memTier) + ' 档 · 通道 ' +
    (d ? d.channel : 'lite（离线默认）') + ' · 缓冲上限 ' + Math.round(c.maxBufferSize/1000000) + 'MB / ' +
    c.maxBufferLength + 's · 码率上限 ' + (c.autoLevelCapping >= 0 ? ('第 ' + c.autoLevelCapping + ' 档') : '自动') +
    (d && d.device && d.device.unrestricted ? ' · 任意设备可用' : ''));
}
function khFeatureAutoUpdate(){
  var d = window.KH_DELIVERY_PLAN, u = d && d.update;
  if(!u){ khApplyDeliveryPlan(); toast('🔄 正在自动比对版本与下发通道…'); return; }
  toast('🔄 自动更新：v' + (u.latest.versionName || '-') + ' #' + (u.latest.versionCode || '-') +
    ' · ' + (u.needUpdate ? '发现新版，已提示下载（安装需确认）' : '已是最新') +
    ' · 功能 / 源 / 播放档位自动同步 · ' + (d.channel === 'lite' ? '免安装通道永远最新' : 'SHA256 校验值已下发'));
  khApplyDeliveryPlan();
}
/* OS 版本检测回传：把系统版本 / API / 架构 / 内存 / 客户端版本自动回传中枢，
   中枢自动优化兼容策略、自动修复漂移、刷新功能快照，随后随下发清单同步更新。
   两端共用（HAP 端的 fetch 包装会把 /api/ 指向桌面中枢）。 */
function khDevicePayload(){
  var d = window.KH_DEVICE || {}, p = khPlayerProfile();
  var id = 'dev-anon';
  try{
    id = localStorage.getItem('khDeviceId');
    if(!id){ id = 'dev-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,8); localStorage.setItem('khDeviceId', id); }
  }catch(e){}
  return {
    schema: 1, app: 'HongHub', kind: 'device-profile', deviceId: id,
    platform: window.KH_HARMONY ? 'harmony' : 'desktop',
    os: d.osFullName || p.os || '', osFullName: d.osFullName || '',
    osVersion: d.osVersion || '', apiVersion: d.apiVersion || null,
    ua: navigator.userAgent || '', marketName: d.marketName || '', abi: d.abi || '',
    tier: d.tier || '', arch: p.arch, mem: p.mem, memTier: p.memTier,
    appCode: KH_APP_CODE, screenW: window.innerWidth || 0, screenH: window.innerHeight || 0
  };
}
function khReportDevice(){
  if(!window.fetch) return;
  var payload = khDevicePayload();
  fetch('/api/device/report', { method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify(payload), cache:'no-store' })
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(!d || !d.ok) return;
      window.KH_OS_OPTIMIZATION = d.optimization || null;
      window.KH_OS_SUMMARY = d.summary || null;
      // 自动应用优化后的兼容策略（跟随本机 OS 版本，影响下一次起播）
      var o = d.optimization || {}, c = o.compat;
      if(c){
        window.KH_COMPAT = c;
        var ov = { enableWorker: c.worker !== false,
          fragLoadingTimeOut: c.timeoutMs || 20000,
          manifestLoadingTimeOut: Math.max(6000, (c.timeoutMs || 20000) - 2000) };
        if(o.playback && isFinite(o.playback.autoLevelCapping)) ov.autoLevelCapping = o.playback.autoLevelCapping;
        if(window.KHPlayer && window.KHPlayer.override) window.KHPlayer.override(ov);
      }
      // 同步更新：优化后功能快照可能刷新，立即拉一次最新功能清单
      if(d.features){
        fetch('/api/features/sync', {cache:'no-store'}).then(function(r){ return r.json(); })
          .then(function(f){ if(f && Array.isArray(f.features)) window.__khLoadFeatures(f.features, f.version); }).catch(function(){});
      }
      try{ khRenderTools(); }catch(e){}
    }).catch(function(){});
}
function khFeatureOS(){
  var o = window.KH_OS_OPTIMIZATION || {}, s = window.KH_OS_SUMMARY || {};
  toast('🖥️ OS 版本检测回传：' + (o.familyLabel || '检测中') + ' ' + (o.osVersion || '') +
    ' · ' + (o.memTier || '') + ' 内存档 · 自动修复 ' + ((o.fixes || []).length) + ' 项' +
    ' · 跟随 ' + (s.families || 0) + ' 个系统家族 / ' + (s.osVersions || 0) + ' 个版本 · 已自动下发同步更新');
}
/* 内嵌功能快照先渲染：开发者端 / 深开鸿端离线也能看到自动添加的新功能，在线清单随后覆盖 */
(function(){
  try{
    if(Array.isArray(window.KH_FEATURE_SNAPSHOT) && window.KH_FEATURE_SNAPSHOT.length){
      window.__khLoadFeatures(window.KH_FEATURE_SNAPSHOT, window.KH_FEATURE_SNAPSHOT_VERSION || null);
    }
  }catch(e){}
})();

(function () {
  if (!window.KH_DESKTOP) return;
  try {
    window.__khSetDeviceProfile({
      marketName: '桌面版 Desktop', deviceType: 'desktop', model: 'HongHub-Desktop',
      abi: 'web', osFullName: navigator.userAgent, apiVersion: 26, minApi: 12, targetApi: 26,
      tier: 'high', screenW: window.innerWidth || 1280, screenH: window.innerHeight || 720,
      densityDPI: 96, appVersion: '1.7.8-desktop', appCode: 1000122
    });
  } catch (e) {}
  function deskUpdate() {
    fetch('/api/manifest', { cache: 'no-store' }).then(function (r) { return r.json(); })
      .then(function (d) {
        if (d && d.sources) window.__khApplySources(JSON.stringify(d.sources));
        if (d && d.release) window.__khSetRelease(JSON.stringify(d.release));
      }).catch(function () {});
  }
  deskUpdate();
  setTimeout(deskUpdate, 9000);
  fetch('/api/features', { cache: 'no-store' }).then(function (r) { return r.json(); })
    .then(function (d) { if (d && Array.isArray(d.features)) window.__khLoadFeatures(d.features, d.version); })
    .catch(function () {});
})();

/* 自动下发 + 自动更新：启动即自动跑一轮，之后每 10 分钟自动比对版本与播放档位。
   桌面端与深开鸿端共用（HAP 端的 fetch 包装会自动把 /api/ 指向桌面中枢），全程无需人工。 */
try {
  setTimeout(khApplyDeliveryPlan, 1500);
  setInterval(khApplyDeliveryPlan, 600000);
  // OS 版本检测回传：启动 3 秒后自动跑一轮，之后每 10 分钟自动回传并同步优化结果
  setTimeout(khReportDevice, 3000);
  setInterval(khReportDevice, 600000);
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) { khApplyDeliveryPlan(); khReportDevice(); }
  });
} catch (e) {}


/* 自检入口：便于无头浏览器验证「点击即播」链路。
   ?selftest=1     自动播放第一部（在线主源，验证多源回退）
   ?selftest=local 自动播放第一部的备用线路（验证换源链路）
   ?selftest=sites 落在网站管理视图 */
if(/[?&]selftest=1/.test(location.search)){
  setTimeout(function(){ openPlayer(allMovies()[0]); }, 60);
}
if(/[?&]selftest=local/.test(location.search)){
  setTimeout(function(){ openPlayer(allMovies()[0], 2); }, 60);
}
/* 预览入口：?view=live 只停在直播频道列表，不自动播放 */
if(/[?&]view=live(?:&|$)/.test(location.search)){
  state.view = 'live'; render();
}
/* 直播自检：三条独立播放路径，不依赖频道库具体数量。
   live       = 第一个频道，从网络主源起播（验证点开直接播真实直播）
   livehls    = 直接加载网络 HLS 直播流（验证原生 / hls.js 引擎分层）
   liveonline = 带真实网络源的频道，从在线源起播（验证网络直播 + 看门狗） */
var liveSelfTest = /[?&]selftest=(live|livehls|liveonline)(?:&|$)/.exec(location.search);
if(liveSelfTest){
  state.view = 'live'; render();
  var liveMode = liveSelfTest[1];
  setTimeout(function(){
    if(liveMode === 'livehls'){
      var ch = {id:'selftest_hls', no:1, name:'网络 HLS 自检', group:'自检', logo:'H',
                color:'#2E86C1', epg:EPG_NEWS, net:true,
                sources:[{label:'网络 HLS 源', url:'http://124.165.251.82:85/tsfile/live/0001_1.m3u8?key=txiptv&playlive=1&authid=0'}]};
      openPlayer(liveMovieObj(ch), 0);
    } else if(liveMode === 'liveonline'){
      var netCh = LIVE_CHANNELS.filter(function(c){ return c.net; })[0];
      openLiveChannel(netCh, 0);
    } else {
      openLiveChannel(LIVE_CHANNELS[0], 0);
    }
  }, 80);
}
/* 直播页时钟（仅改文本，不触发 render） */
setInterval(function(){
  var hc = document.getElementById('heroClock');
  var lc = document.getElementById('lbClock');
  if(!hc && !lc) return;
  var d = new Date(), p = function(n){ return (n < 10 ? '0' : '') + n; };
  var t = p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
  if(hc) hc.textContent = t;
  if(lc) lc.textContent = t;
}, 1000);
</script>
